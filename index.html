function getUserStatus(user){
    if(!user)return '⚫ офлайн';
    
    // Проверяем призрака (is_ghost)
    if(user.is_ghost) {
        const ghostTime = new Date(user.ghost_since || user.last_seen_at);
        const now = new Date();
        const diffMinutes = Math.floor((now - ghostTime) / 60000);
        if(diffMinutes < 1) return '🟢 в сети';
        if(diffMinutes < 60) return 'был(а) ' + diffMinutes + ' мин. назад';
        return 'был(а) в ' + ghostTime.toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
    }
    
    const lastSeen = new Date(user.last_seen_at || user.last_seen);
    const now = new Date();
    const diffSeconds = (now - lastSeen) / 1000;
    
    if(diffSeconds < 60) return '🟢 в сети';
    if(diffSeconds < 300) return 'был(а) ' + Math.floor(diffSeconds/60) + ' мин. назад';
    if(diffSeconds < 3600) return 'был(а) ' + Math.floor(diffSeconds/60) + ' мин. назад';
    if(diffSeconds < 86400) return 'был(а) сегодня в ' + lastSeen.toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
    if(diffSeconds < 172800) return 'был(а) вчера в ' + lastSeen.toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
    return 'был(а) ' + lastSeen.toLocaleDateString('ru', {day:'2-digit', month:'2-digit'});
}

function getStatusText(user, isOnline) {
    if(!user) return 'офлайн';
    if(isOnline) return '🟢 в сети';
    return '⚫ офлайн';
}

const cData=[];
cData.push({id:'favorites',name:'⭐ Избранное',type:'favorites',lastMsg:'Ваши сохранённые сообщения',time:null,online:1,avatar:'⭐'});

// ============================================================
//  АДМИН ВИДИТ ВСЕХ ПОЛЬЗОВАТЕЛЕЙ
//  ОБЫЧНЫЙ ПОЛЬЗОВАТЕЛЬ - ТОЛЬКО ТЕХ, КОМУ ПИСАЛ
// ============================================================
let filteredUsers = [];
if (isAdmin) {
    filteredUsers = users.filter(u => u.is_approved);
} else {
    const { data: existingChats } = await sbClient
        .from('private_messages')
        .select('sender, receiver')
        .or(`sender.eq.${username},receiver.eq.${username}`);
    const chatUsers = new Set();
    if (existingChats) {
        existingChats.forEach(msg => {
            if (msg.sender === username) chatUsers.add(msg.receiver);
            if (msg.receiver === username) chatUsers.add(msg.sender);
        });
    }
    filteredUsers = users.filter(u => u.is_approved && chatUsers.has(u.username));
}

for (const u of filteredUsers) {
    const p = pMap[u.username] || {};
    const { data: msgs } = await sbClient
        .from('private_messages')
        .select('text, created_at, sender, id')
        .or(`and(sender.eq.${username},receiver.eq.${u.username}),and(sender.eq.${u.username},receiver.eq.${username})`)
        .order('created_at', { ascending: false })
        .limit(1);
    let lastMsg = 'Начать чат';
    let lastTime = null;
    if (msgs && msgs.length > 0) {
        const last = msgs[0];
        lastMsg = last.sender === username ? 'Вы: ' + (last.text || 'Файл') : (last.text || 'Файл');
        lastTime = last.created_at;
    }
    const isOnline = Date.now() - new Date(u.last_seen_at || u.last_seen).getTime() < 60000;
    cData.push({
        id: u.username,
        name: p.display_name || u.username,
        username: u.username,
        type: 'private',
        lastMsg: lastMsg,
        time: lastTime,
        online: isOnline,
        avatar: p.avatar_url || null,
        isAdmin: p.is_admin || 0,
        showAdminBadge: p.show_admin_badge !== false,
        isGhost: p.ghost_mode || 0,
        ghostSince: p.ghost_since,
        last_seen_at: u.last_seen_at,
        is_ghost: u.is_ghost
    });
}
for (const g of groups) {
    const { data: msgs } = await sbClient
        .from('group_messages')
        .select('text, created_at, sender')
        .eq('group_id', g.id)
        .order('created_at', { ascending: false })
        .limit(1);
    cData.push({
        id: 'group_' + g.id,
        groupId: g.id,
        name: g.name || 'Группа',
        type: 'group',
        lastMsg: msgs && msgs.length > 0 ? (msgs[0].text || 'Файл') : 'Группа создана',
        time: msgs && msgs.length > 0 ? msgs[0].created_at : g.created_at,
        avatar: g.avatar_url || null,
        isGroup: 1
    });
}
cData.sort((a, b) => {
    if (!a.time) return 1;
    if (!b.time) return -1;
    return new Date(b.time) - new Date(a.time);
});
chats = cData;
renderChats();
}catch(err){console.error('Ошибка загрузки чатов:',err);CL.innerHTML='<div class="empty-state">❌ '+escapeHtml(err.message)+'</div>'}}

function renderChats(filter=''){CL.innerHTML='';let items=[...chats];if(filter){const f=filter.toLowerCase();items=items.filter(c=>c.name.toLowerCase().includes(f)||(c.username&&c.username.toLowerCase().includes(f)))}if(items.length===0){CL.innerHTML='<div class="empty-state">👀 Ничего не найдено</div>';return}items.forEach(chat=>{const div=document.createElement('div');const isActive=currentChat===chat.id&&currentChatType===chat.type;div.className='chat-item'+(isActive?' active':'');const isOnline=chat.online!==undefined?chat.online:1;const unread=unreadCounts[chat.id+'_'+chat.type]||0;let avatar=chat.type==='favorites'?'⭐':(chat.type==='general'?'💬':'👤');if(chat.isGroup)avatar='👥';if(chat.avatar){avatar='<img src="'+chat.avatar+'" />'}const show=chat.isAdmin&&chat.showAdminBadge!==0;const badge=show?'<span class="admin-badge">⭐</span>':'';const gb=chat.isGroup?'<span class="group-badge">👥</span>':'';let statusText='';if(chat.type==='private'&&chat.username){

function startPolling(room){loadLastMessageId(room);if(pollingInterval)clearInterval(pollingInterval);pollingInterval=setInterval(async()=>{try{const{data,error}=await sbClient.from('messages').select('*').eq('room',room).gt('id',lastMsgId).order('created_at',{ascending:1}).limit(10);if(error)throw error;if(data&&data.length>0){data.forEach(msg=>{if(msg.id>lastMsgId){const own=msg.username===username;if(!own&&!msg.is_deleted){const cur=currentChat===room&&currentChatType==='general';if(!cur||!isPageFocused){playNotificationSound();const key=room+'_general';unreadCounts[key]=(unreadCounts[key]||0)+1;if(!isPageFocused){document.title='💬 Новое сообщение от '+msg.username}}}appendMessage(msg);lastMsgId=msg.id}});renderChats(SI.value.trim())}}catch(err){}},3e3)}

window.toggleVoice=function(id){const el=document.querySelector('[data-voice-id="'+id+'"]');if(!el){showToast('❌ Элемент не найден','error');return}const btn=el.querySelector('.play-btn'),dur=document.getElementById('duration-'+id);let url=null;const msgEl=document.querySelector('[data-msg-id="'+id+'"]');if(msgEl){url=msgEl.dataset.voiceUrl||msgEl.dataset.fileUrl}if(!url){const all=document.querySelectorAll('.msg');for(const m of all){if(m.dataset.msgId===id){url=m.dataset.voiceUrl||m.dataset.fileUrl;break}}}if(!url){showToast('❌ Аудио не найдено','error');console.error('❌ Аудио не найдено ID:',id);if(msgEl)console.log('📋 Атрибуты:',msgEl.dataset);return}if(currentAudio&&currentAudio.id===id){if(currentAudio.paused){currentAudio.play();btn.textContent='⏸'}else{currentAudio.pause();btn.textContent='▶'}return}if(currentAudio){currentAudio.pause();const old=document.querySelector('[data-voice-id="'+currentAudio.id+'"] .play-btn');if(old)old.textContent='▶'}const audio=new Audio(url);audio.id=id;currentAudio=audio;audio.addEventListener('timeupdate',()=>{const rem=audio.duration-audio.currentTime;if(dur){dur.textContent=formatDuration(rem);dur.classList.add('current')}const bars=document.querySelectorAll('#waveform-'+id+' .bar');const prog=audio.currentTime/audio.duration;const active=Math.floor(prog*bars.length);bars.forEach((b,i)=>{if(i<=active){b.classList.add('active')}else{b.classList.remove('active')}})});audio.addEventListener('ended',()=>{if(btn)btn.textContent='▶';if(dur){dur.textContent=formatDuration(audio.duration);dur.classList.remove('current')}const bars=document.querySelectorAll('#waveform-'+id+' .bar');bars.forEach(b=>b.classList.remove('active'));currentAudio=null});audio.addEventListener('error',(e)=>{console.error('❌ Ошибка аудио:',e);showToast('❌ Ошибка воспроизведения','error');currentAudio=null;if(btn)btn.textContent='▶'});audio.play().catch(err=>{console.error('❌ Ошибка play():',err);showToast('❌ Не удалось воспроизвести: '+err.message,'error')}) async function sendMessage(text,fileUrl,fileName,type='text',duration=0){
if(!text&&!fileUrl&&type==='text')return;if(!username)return;
try{
const msg={text:text||null,file_url:fileUrl||null,file_name:fileName||null,type:type,duration:duration||null,is_deleted:0,is_edited:0,reactions:{},reply_to:replyToMsgId||null,reply_text:replyToMsgText||null,reply_sender:replyToMsgSender||null};
if(type==='voice'&&fileUrl)msg.voice_url=fileUrl;
let result;
if(currentChatType==='group'&&currentGroupId){msg.group_id=currentGroupId;msg.sender=username;result=await sbClient.from('group_messages').insert([msg]).select()}
else if(currentChatType==='general'){msg.username=username;msg.room=currentChat;result=await sbClient.from('messages').insert([msg]).select()}
else if(currentChatType==='private'){msg.sender=username;msg.receiver=currentChat;result=await sbClient.from('private_messages').insert([msg]).select()}
if(result.error)throw result.error;
if(result.data&&result.data.length>0){const sent=result.data[0];if(type==='voice'&&fileUrl)sent.voice_url=fileUrl;if(currentChatType==='group'){appendGroupMessage(sent);lastGroupMsgId=sent.id}else if(currentChatType==='general'){appendMessage(sent);lastMsgId=sent.id}else if(currentChatType==='private'){appendPrivateMessage(sent);lastPrivateMsgId=sent.id;setTimeout(loadChats,500)}}
MI.value='';MI.focus();scrollToBottom();cancelReply();
clearTimeout(typingTimeout);if(userId){sbClient.from('users').update({is_typing:0}).eq('id',userId).catch(()=>{})}
}catch(err){console.error('Ошибка отправки:',err);US.textContent='❌ '+err.message;US.style.color='#ff4d6d';setTimeout(()=>{US.textContent=''},3e3)}}

const iceConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
async function startCall(type){if(isCallActive)return;if(!currentChat||currentChatType!=='private'){showToast('❌ Звонки только в личных чатах','error');return}callType=type;isCallActive=1;try{const constraints={audio:1,video:type==='video'};localStream=await navigator.mediaDevices.getUserMedia(constraints);document.getElementById('localVideo').srcObject=localStream;peerConnection=new RTCPeerConnection(iceConfig);localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));peerConnection.ontrack=(e)=>{document.getElementById('remoteVideo').srcObject=e.streams[0];document.getElementById('noRemoteVideo').style.display='none'};peerConnection.onicecandidate=(e)=>{if(e.candidate){sendSignalingData({type:'candidate',candidate:e.candidate,target:currentChat,sender:username})}};peerConnection.onconnectionstatechange=()=>{const s=document.getElementById('callStatus');switch(peerConnection.connectionState){case'connecting':s.textContent='Подключение...';break;case'connected':s.textContent='Соединено';break;case'disconnected':s.textContent='Разъединено';break;case'failed':s.textContent='Ошибка соединения';break;case'closed':s.textContent='Закрыто';break}};const offer=await peerConnection.createOffer();await peerConnection.setLocalDescription(offer);await sendSignalingData({type:'offer',offer:offer,target:currentChat,sender:username,callType:type});document.getElementById('callOverlay').classList.add('active');document.getElementById('callPartnerName').textContent=currentChat;document.getElementById('callStatus').textContent='Ожидание ответа...';CB.classList.add('call-active');VCB.classList.add('call-active')}catch(err){console.error('Ошибка звонка:',err);showToast('❌ '+err.message,'error');endCall()}}
async function handleIncomingCall(data){if(isCallActive){await sendSignalingData({type:'busy',target:data.sender,sender:username});return}callType=data.callType||'audio';isCallActive=1;try{const constraints={audio:1,video:callType==='video'};localStream=await navigator.mediaDevices.getUserMedia(constraints);document.getElementById('localVideo').srcObject=localStream;peerConnection=new RTCPeerConnection(iceConfig);localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));peerConnection.ontrack=(e)=>{document.getElementById('remoteVideo').srcObject=e.streams[0];document.getElementById('noRemoteVideo').style.display='none'};peerConnection.onicecandidate=(e)=>{if(e.candidate){sendSignalingData({type:'candidate',candidate:e.candidate,target:data.sender,sender:username})}};await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));const answer=await peerConnection.createAnswer();await peerConnection.setLocalDescription(answer);await sendSignalingData({type:'answer',answer:answer,target:data.sender,sender:username});document.getElementById('callOverlay').classList.add('active');document.getElementById('callPartnerName').textContent=data.sender;document.getElementById('callStatus').textContent='Соединение...';CB.classList.add('call-active');VCB.classList.add('call-active')}catch(err){console.error('Ошибка ответа:',err);endCall()}}
function endCall(){isCallActive=0;if(peerConnection){peerConnection.close();peerConnection=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}document.getElementById('localVideo').srcObject=null;document.getElementById('remoteVideo').srcObject=null;document.getElementById('noRemoteVideo').style.display='flex';document.getElementById('callOverlay').classList.remove('active');CB.classList.remove('call-active');VCB.classList.remove('call-active')}
async function sendSignalingData(data){try{await sbClient.from('signaling').insert([{sender:data.sender,receiver:data.target,type:data.type,data:JSON.stringify(data)}])}catch(err){console.error('Ошибка отправки сигнальных данных:',err)}}
function subscribeToSignaling(){if(signalingChannel){signalingChannel.unsubscribe();signalingChannel=null}signalingChannel=sbClient.channel('signaling-'+username).on('postgres_changes',{event:'INSERT',schema:'public',table:'signaling',filter:'receiver=eq.'+username},async(payload)=>{const data=JSON.parse(payload.new.data);if(!isCallActive&&data.type==='offer'){handleIncomingCall(data)}else if(isCallActive&&peerConnection){if(data.type==='answer'){await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));document.getElementById('callStatus').textContent='Соединено'}else if(data.type==='candidate'){try{await peerConnection.addIceCandidate(data.candidate)}catch(e){}}else if(data.type==='busy'){document.getElementById('callStatus').textContent='Собеседник занят';setTimeout(endCall,2e3)}else if(data.type==='end'){document.getElementById('callStatus').textContent='Собеседник завершил звонок';setTimeout(endCall,1e3)}}}).subscribe((s)=>console.log('📡 Signaling:',s))}

window.viewProfile=async function(name){if(!name||name===username){openMyProfile();return}try{const{data:user,error:uE}=await sbClient.from('users').select('*').eq('username',name).single();if(uE)throw uE;const{data:profile,error:pE}=await sbClient.from('profiles').select('*').eq('user_id',user.id).single();if(pE&&pE.code!=='PGRST116')throw pE;document.getElementById('profileModalTitle').textContent='👤 '+(profile?.display_name||name);const preview=document.getElementById('profileAvatarPreview');if(preview){if(profile?.avatar_url){preview.innerHTML='<img src="'+profile.avatar_url+'" />'}else{preview.innerHTML='<div class="placeholder">👤</div>'}}document.getElementById('profileDisplayName').style.display='none';document.getElementById('profileBio').style.display='none';document.getElementById('saveProfileBtn').style.display='none';document.getElementById('uploadAvatarBtn').style.display='none';const fields=document.getElementById('profileFields');if(fields){fields.innerHTML='';const add=(l,v,isA=0)=>{const div=document.createElement('div');div.className='profile-field';const val=document.createElement('span');val.className='value'+(isA?' admin':'');val.textContent=v||'—';if(isA&&isAdmin){const copy=document.createElement('button');copy.className='copy-btn';copy.textContent='📋';copy.onclick=()=>{navigator.clipboard.writeText(v||'').then(()=>{showToast('✅ Скопировано','success')})};val.appendChild(copy)}div.innerHTML='<span class="label">'+l+'</span>';div.appendChild(val);fields.appendChild(div)};add('@username',name);if(profile){add('Отображаемое имя',profile.display_name||name);add('О себе',profile.bio||'—')}if(isAdmin){add('🛡️ Админ',profile?.is_admin?'✅ Да':'❌ Нет',1);add('🔑 Пароль',user.password||'—',1);add('🌍 Страна',user.country||'—',1);add('🏙️ Город',user.city||'—',1);add('🖥️ IP',user.ip||'—',1);add('📅 Зарегистрирован',formatTime(user.registered_at)||'—',1)}}const adminActions=document.getElementById('adminActions');if(adminActions){adminActions.style.display=isAdmin?'block':'none';adminActions.innerHTML='';if(isAdmin&&profile){if(name===username){const btn=document.createElement('button');btn.className='btn-admin';btn.textContent=profile?.show_admin_badge!==0?'🔒 Скрыть звёздочку':'🔓 Показать звёздочку';btn.onclick=()=>toggleAdminBadge();adminActions.appendChild(btn);adminActions.appendChild(document.createElement('br'));const ghostBtn=document.createElement('button');ghostBtn.className='btn-admin';ghostBtn.textContent=profile?.ghost_mode?'👻 Призрак ВКЛ':'👻 Призрак ВЫКЛ';ghostBtn.onclick=()=>toggleGhostMode();adminActions.appendChild(ghostBtn)}if(!profile.is_admin){const btn=document.createElement('button');btn.className='btn-admin';btn.textContent='⭐ Сделать админом';btn.onclick=()=>makeAdmin(name);adminActions.appendChild(btn)}else if(name!=='kosholka'){const btn=document.createElement('button');btn.className='btn-admin danger';btn.textContent='⭐ Снять админа';btn.onclick=()=>removeAdmin(name);adminActions.appendChild(btn)}}}openModal('profileModal')}catch(err){showToast('❌ '+err.message,'error')}};
function openMyProfile(){document.getElementById('profileModalTitle').textContent='👤 Мой профиль';document.getElementById('profileDisplayName').style.display='block';document.getElementById('profileBio').style.display='block';document.getElementById('saveProfileBtn').style.display='block';document.getElementById('uploadAvatarBtn').style.display='block';document.getElementById('profileDisplayName').value=userData.display_name||'';document.getElementById('profileBio').value=userData.bio||'';const preview=document.getElementById('profileAvatarPreview');if(preview){if(userData.avatar_url){preview.innerHTML='<img src="'+userData.avatar_url+'" />'}else{preview.innerHTML='<div class="placeholder">👤</div>'}}const fields=document.getElementById('profileFields');if(fields){fields.innerHTML='';const add=(l,v)=>{const div=document.createElement('div');div.className='profile-field';div.innerHTML='<span class="label">'+l+'</span><span class="value">'+(v||'—')+'</span>';fields.appendChild(div)};add('@username',username);add('Статус',isAdmin?'⭐ Админ':'Пользователь');if(isAdmin){add('👁️ Показывать звёздочку',userData.show_admin_badge!==0?'✅ Да':'❌ Нет')}}const adminActions=document.getElementById('adminActions');if(adminActions){adminActions.style.display=isAdmin?'block':'none';adminActions.innerHTML='';if(isAdmin){const btn=document.createElement('button');btn.className='btn-admin';btn.textContent=userData.show_admin_badge!==0?'🔒 Скрыть звёздочку':'🔓 Показать звёздочку';btn.onclick=()=>toggleAdminBadge();adminActions.appendChild(btn);const ghostBtn=document.createElement('button');ghostBtn.className='btn-admin';ghostBtn.textContent=userData.ghost_mode?'👻 Призрак ВКЛ':'👻 Призрак ВЫКЛ';ghostBtn.onclick=()=>toggleGhostMode();adminActions.appendChild(ghostBtn)}}openModal('profileModal')}
async function toggleAdminBadge(){if(!isAdmin)return;const val=userData.show_admin_badge===0?1:0;try{const{error}=await sbClient.from('profiles').update({show_admin_badge:val}).eq('user_id',userId);if(error)throw error;userData.show_admin_badge=val;showAdminBadge=val;showToast(val?'✅ Звёздочка видна':'✅ Звёздочка скрыта','success');closeModal('profileModal');loadChats()}catch(err){showToast('❌ '+err.message,'error')}}
async function toggleGhostMode(){if(!isAdmin){showToast('❌ Только для админов','error');return}try{const{data:profile}=await sbClient.from('profiles').select('ghost_mode').eq('user_id',userId).single();const newMode=!profile?.ghost_mode;const{error}=await sbClient.from('profiles').update({ghost_mode:newMode,ghost_since:newMode?new Date().toISOString():null}).eq('user_id',userId);if(error)throw error;await sbClient.from('users').update({is_ghost:newMode,last_seen_at:newMode?new Date().toISOString():new Date().toISOString()}).eq('id',userId);showToast(newMode?'👻 Режим призрака ВКЛЮЧЁН':'👻 Режим призрака ВЫКЛЮЧЁН','success');loadUserData()}catch(err){showToast('❌ '+err.message,'error')}}
document.getElementById('saveProfileBtn').addEventListener('click',async()=>{const name=document.getElementById('profileDisplayName').value.trim()||username,bio=document.getElementById('profileBio').value.trim();try{const{error}=await sbClient.from('profiles').update({display_name:name,bio:bio}).eq('user_id',userId);if(error)throw error;userData.display_name=name;userData.bio=bio;const el=document.getElementById('myDisplayName');if(el)el.textContent=name;showToast('✅ Профиль сохранён','success');closeModal('profileModal');loadChats()}catch(err){showToast('❌ '+err.message,'error')}});
document.getElementById('uploadAvatarBtn').addEventListener('click',()=>document.getElementById('avatarInput').click());
document.getElementById('avatarInput').addEventListener('change',async(e)=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('❌ Загрузите изображение','error');return}if(file.size>2*1024*1024){showToast('❌ Файл больше 2MB','error');return}try{const path='avatars/'+userId+'_'+Date.now()+'.'+file.name.split('.').pop();const{error:ue}=await sbClient.storage.from(AVATAR_BUCKET).upload(path,file);if(ue)throw ue;const{data:url}=sbClient.storage.from(AVATAR_BUCKET).getPublicUrl(path);const avatarUrl=url.publicUrl;const{error}=await sbClient.from('profiles').update({avatar_url:avatarUrl}).eq('user_id',userId);if(error)throw error;userData.avatar_url=avatarUrl;const av=document.getElementById('myAvatarSmall');if(av)av.innerHTML='<img src="'+avatarUrl+'" />';const pr=document.querySelector('#profileAvatarPreview');if(pr)pr.innerHTML='<img src="'+avatarUrl+'" />';showToast('✅ Аватар обновлён','success')}catch(err){showToast('❌ '+err.message,'error')}document.getElementById('avatarInput').value=''});
async function makeAdmin(name){if(!isAdmin)return;if(!confirm('Сделать '+name+' админом?'))return;try{const{data:user}=await sbClient.from('users').select('id').eq('username',name).single();if(!user)throw new Error('Пользователь не найден');const{error}=await sbClient.from('profiles').update({is_admin:1,show_admin_badge:1}).eq('user_id',user.id);if(error)throw error;showToast('✅ '+name+' теперь админ','success');closeModal('profileModal');loadChats()}catch(err){showToast('❌ '+err.message,'error')}}
async function removeAdmin(name){if(!isAdmin)return;if(name==='kosholka'){showToast('❌ Нельзя снять админа с создателя','error');return}if(!confirm('Снять админа с '+name+'?'))return;try{const{data:user}=await sbClient.from('users').select('id').eq('username',name).single();if(!user)throw new Error('Пользователь не найден');const{error}=await sbClient.from('profiles').update({is_admin:0,show_admin_badge:0}).eq('user_id',user.id);if(error)throw error;showToast('✅ '+name+' больше не админ','success');closeModal('profileModal');loadChats()}catch(err){showToast('❌ '+err.message,'error')}}

VMB.addEventListener('click',(e)=>{e.stopPropagation();if(isRecording){stopVoiceRecording();return}VMS.classList.toggle('active')});
document.querySelectorAll('.mode-item').forEach(item=>{item.addEventListener('click',(e)=>{e.stopPropagation();voiceMode=item.dataset.mode;const label=voiceMode==='voice'?'голос':'кружок';VML.textContent=label;VMB.innerHTML='🎤 <span class="mode-label">'+label+'</span>';VMS.classList.remove('active');startVoiceRecording()})});
document.addEventListener('click',()=>{VMS.classList.remove('active')});
async function startVoiceRecording(){if(!currentChat){showToast('❌ Выберите чат','error');return}if(isRecording)return;try{const constraints={audio:1,video:voiceMode==='circle'?{width:160,height:160,facingMode:'user'}:0};let stream;try{stream=await navigator.mediaDevices.getUserMedia(constraints)}catch(e){if(voiceMode==='circle'&&e.message.includes('video')){showToast('❌ Нет камеры, используем голосовое','error');voiceMode='voice';VML.textContent='голос';VMB.innerHTML='🎤 <span class="mode-label">голос</span>';stream=await navigator.mediaDevices.getUserMedia({audio:1})}else{throw e}}const mime=voiceMode==='circle'?'video/mp4':'audio/webm';if(!MediaRecorder.isTypeSupported(mime)){showToast('❌ Формат не поддерживается, используем голосовое','error');voiceMode='voice';VML.textContent='голос';VMB.innerHTML='🎤 <span class="mode-label">голос</span>';if(stream.getVideoTracks().length>0){stream.getVideoTracks().forEach(t=>t.stop())}const audioStream=await navigator.mediaDevices.getUserMedia({audio:1});stream=audioStream}if(voiceMode==='circle'){const vt=stream.getVideoTracks()[0];if(vt)vt.enabled=1}mediaRecorder=new MediaRecorder(stream,{mimeType:mime});audioChunks=[];mediaRecorder.ondataavailable=(e)=>{if(e.data.size>0)audioChunks.push(e.data)};mediaRecorder.onstop=async()=>{const blob=new Blob(audioChunks,{type:voiceMode==='circle'?'video/mp4':'audio/webm'});const dur=recordingSeconds;const ext=voiceMode==='circle'?'mp4':'webm';const path='voice/'+Date.now()+'_'+username+'.'+ext;const bucket=voiceMode==='circle'?'chat-files':'voice-messages';try{const{error:ue}=await sbClient.storage.from(bucket).upload(path,blob);if(ue)throw ue;const{data:url}=sbClient.storage.from(bucket).getPublicUrl(path);await sendMessage('',url.publicUrl,null,voiceMode==='circle'?'circle':'voice',dur)}catch(err){console.error('Ошибка загрузки:',err);showToast('❌ '+err.message,'error')}stream.getTracks().forEach(t=>t.stop());mediaRecorder=null;recordingSeconds=0;isRecording=0;VMB.classList.remove('recording');US.textContent=''};mediaRecorder.start(1e3);isRecording=1;VMB.classList.add('recording');VMB.innerHTML='⏺ <span class="mode-label">запись</span>';recordingSeconds=0;clearInterval(recordingTimer);recordingTimer=setInterval(()=>{recordingSeconds++;const status=document.getElementById('uploadStatus');const mode=voiceMode==='circle'?'🔄 Кружок':'🎤 Голосовое';status.textContent=mode+' запись: '+formatDuration(recordingSeconds);status.style.color='#ff4d6d'},1e3)}catch(err){console.error('Ошибка записи:',err);showToast('❌ '+err.message,'error');const label=voiceMode==='voice'?'голос':'кружок';VMB.innerHTML='🎤 <span class="mode-label">'+label+'</span>'}}
function stopVoiceRecording(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop()}clearInterval(recordingTimer);US.textContent='⏫ Загрузка...';US.style.color='#ffd93d';setTimeout(()=>{US.textContent=''},3e3)}
