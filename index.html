<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💬 Братанский мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0b0f;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #11131e;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #loginScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            flex: 1;
            gap: 16px;
        }
        #loginScreen h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loginScreen input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #loginScreen input:focus {
            border-color: rgba(0, 212, 255, 0.3);
        }
        #loginScreen button {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        #loginScreen .error {
            color: #ff4d6d;
            font-size: 13px;
            min-height: 20px;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }
        #header .user {
            font-size: 14px;
            font-weight: 600;
            color: #00d4ff;
        }
        #header .online {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
        #header button {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.1);
            border-radius: 20px;
            padding: 4px 14px;
            color: #ff4d6d;
            font-size: 11px;
            cursor: pointer;
        }

        #rooms {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            overflow-x: auto;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        #rooms::-webkit-scrollbar {
            height: 2px;
        }
        #rooms::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .room-tab {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            transition: all 0.2s;
        }
        .room-tab.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .room-tab:active {
            transform: scale(0.94);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #messages::-webkit-scrollbar {
            width: 3px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.2s;
        }
        .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .msg .sender {
            font-size: 10px;
            color: #00d4ffaa;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .msg .time {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 2px;
            text-align: right;
        }
        .msg img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg .file-link {
            color: #00d4ff;
            text-decoration: underline;
            word-break: break-all;
            display: inline-block;
            margin-top: 2px;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #inputArea {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
        }
        #inputArea input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #inputArea input[type="text"]:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #inputArea .btn-send {
            padding: 10px 18px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #inputArea .btn-file {
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #inputArea .btn-file:active,
        #inputArea .btn-send:active {
            transform: scale(0.94);
        }
        #fileInput {
            display: none;
        }
        #uploadStatus {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            padding: 2px 12px;
            text-align: center;
            min-height: 16px;
        }

        @media (min-width: 600px) {
            #app {
                border-radius: 24px;
                height: 90vh;
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <div id="loginScreen">
            <h1>💬 Братанский</h1>
            <p style="color:rgba(255,255,255,0.2);font-size:13px;">Введи имя чтобы войти</p>
            <input id="usernameInput" type="text" placeholder="Твой ник" maxlength="20" />
            <div class="error" id="loginError"></div>
            <button id="loginBtn">ВОЙТИ</button>
        </div>

        <div id="chatUI" style="display:none;flex-direction:column;flex:1;overflow:hidden;">

            <div id="header">
                <div>
                    <span class="user" id="currentUser">—</span>
                    <div class="online">онлайн</div>
                </div>
                <button id="logoutBtn">Выйти</button>
            </div>

            <div id="rooms">
                <div class="room-tab active" data-room="general"># Общий</div>
                <div class="room-tab" data-room="random"># Рандом</div>
                <div class="room-tab" data-room="sport"># Спорт</div>
                <div class="room-tab" data-room="dev"># Dev</div>
            </div>

            <div id="messages"></div>
            <div id="uploadStatus"></div>

            <div id="inputArea">
                <button class="btn-file" id="fileBtn">📎</button>
                <input id="fileInput" type="file" multiple />
                <input id="msgInput" type="text" placeholder="Напиши что-то..." />
                <button class="btn-send" id="sendBtn">→</button>
            </div>

        </div>

    </div>

    <script>
        // ============================================================
        //  ⚡ ТВОИ ДАННЫЕ SUPABASE (УЖЕ ВСТАВЛЕНЫ)
        // ============================================================
        const SUPABASE_URL = 'https://uxjoowanhrmbrnqtghyc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3Dzhz17WLtHl1jguQlGNTQ_gu2REAg6';
        const BUCKET = 'chat-files';
        // ============================================================

        // ВАЖНО: используем sbClient вместо supabase, чтобы не конфликтовать
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------- ЭЛЕМЕНТЫ ----------
        const loginScreen = document.getElementById('loginScreen');
        const chatUI = document.getElementById('chatUI');
        const usernameInput = document.getElementById('usernameInput');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const currentUser = document.getElementById('currentUser');
        const messagesEl = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const roomTabs = document.querySelectorAll('.room-tab');

        // ---------- СОСТОЯНИЕ ----------
        let username = '';
        let currentRoom = 'general';
        let isSubscribed = false;

        // ---------- ФУНКЦИИ ----------
        function scrollToBottom() {
            setTimeout(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }, 50);
        }

        function formatTime(date) {
            return new Date(date).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  ЗАГРУЗКА СООБЩЕНИЙ
        // ============================================================

        async function loadMessages(room) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('messages')
                    .select('*')
                    .eq('room', room)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Сообщений пока нет. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        // ============================================================
        //  ОТРИСОВКА СООБЩЕНИЯ
        // ============================================================

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.className = `msg ${msg.username === username ? 'self' : 'other'}`;

            let content = '';
            if (msg.text) {
                content += escapeHtml(msg.text);
            }
            if (msg.file_url) {
                const ext = msg.file_url.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
                const isVideo = ['mp4', 'mov', 'avi', 'webm'].includes(ext);

                if (isImage) {
                    content += `<br><img src="${msg.file_url}" />`;
                } else if (isVideo) {
                    content += `<br><video src="${msg.file_url}" controls></video>`;
                } else {
                    content += `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 ${escapeHtml(msg.file_name || 'Файл')}</a>`;
                }
            }

            div.innerHTML = `
                <div class="sender">${escapeHtml(msg.username)}</div>
                ${content}
                <div class="time">${formatTime(msg.created_at)}</div>
            `;

            messagesEl.appendChild(div);
        }

        // ============================================================
        //  ОТПРАВКА СООБЩЕНИЯ
        // ============================================================

        async function sendMessage(text, fileUrl = null, fileName = null) {
            if (!text && !fileUrl) return;
            if (!username) return;

            try {
                const { error } = await sbClient
                    .from('messages')
                    .insert([{
                        username: username,
                        room: currentRoom,
                        text: text || null,
                        file_url: fileUrl || null,
                        file_name: fileName || null,
                    }]);

                if (error) throw error;

                msgInput.value = '';
                msgInput.focus();
            } catch (err) {
                console.error('Ошибка отправки:', err);
                uploadStatus.textContent = '❌ ' + err.message;
                uploadStatus.style.color = '#ff4d6d';
                setTimeout(() => {
                    uploadStatus.textContent = '';
                }, 3000);
            }
        }

        // ============================================================
        //  ЗАГРУЗКА ФАЙЛОВ
        // ============================================================

        async function uploadFiles(files) {
            if (!files || files.length === 0) return;

            for (const file of files) {
                uploadStatus.textContent = `⏫ Загрузка: ${file.name} ...`;
                uploadStatus.style.color = '#ffd93d';

                try {
                    const path = `chats/${Date.now()}_${file.name}`;
                    const { error: uploadError } = await sbClient.storage
                        .from(BUCKET)
                        .upload(path, file, {
                            contentType: file.type,
                            cacheControl: '3600',
                        });

                    if (uploadError) throw uploadError;

                    const { data: urlData } = sbClient.storage
                        .from(BUCKET)
                        .getPublicUrl(path);

                    await sendMessage('', urlData.publicUrl, file.name);

                    uploadStatus.textContent = `✅ ${file.name} загружен`;
                    uploadStatus.style.color = '#6fcf97';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 2000);

                } catch (err) {
                    console.error('Ошибка загрузки файла:', err);
                    uploadStatus.textContent = `❌ ${file.name}: ${err.message}`;
                    uploadStatus.style.color = '#ff4d6d';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 3000);
                }
            }
        }

        // ============================================================
        //  REALTIME ПОДПИСКА
        // ============================================================

        function subscribeToMessages() {
            if (isSubscribed) return;

            sbClient
                .channel('messages-channel')
                .on(
                    'postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                        filter: `room=eq.${currentRoom}`,
                    },
                    (payload) => {
                        const msg = payload.new;
                        if (msg.username === username) return;
                        appendMessage(msg);
                        scrollToBottom();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        isSubscribed = true;
                        console.log('✅ Подписка на сообщения активна');
                    }
                });
        }

        // ============================================================
        //  ПЕРЕКЛЮЧЕНИЕ КОМНАТЫ
        // ============================================================

        function switchRoom(room) {
            if (room === currentRoom) return;

            if (isSubscribed) {
                sbClient.channel('messages-channel').unsubscribe();
                isSubscribed = false;
            }

            currentRoom = room;

            roomTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.room === room);
            });

            loadMessages(room);
            subscribeToMessages();
            msgInput.focus();
        }

        // ============================================================
        //  СОБЫТИЯ
        // ============================================================

        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (!name) {
                loginError.textContent = '❌ Введи имя!';
                return;
            }
            if (name.length < 2) {
                loginError.textContent = '❌ Минимум 2 символа';
                return;
            }

            username = name;
            currentUser.textContent = username;
            loginScreen.style.display = 'none';
            chatUI.style.display = 'flex';
            loginError.textContent = '';

            loadMessages(currentRoom);
            subscribeToMessages();
            msgInput.focus();
        });

        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        logoutBtn.addEventListener('click', () => {
            if (isSubscribed) {
                sbClient.channel('messages-channel').unsubscribe();
                isSubscribed = false;
            }
            username = '';
            currentUser.textContent = '';
            chatUI.style.display = 'none';
            loginScreen.style.display = 'flex';
            messagesEl.innerHTML = '';
            usernameInput.value = '';
        });

        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (text) {
                sendMessage(text);
            }
        });

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        fileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFiles(e.target.files);
                fileInput.value = '';
            }
        });

        roomTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                switchRoom(tab.dataset.room);
            });
        });

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        console.log('💬 Братанский мессенджер загружен!');
        console.log('🔐 Введи любое имя — пароля нет');
    </script>
</body>
</html>
