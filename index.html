<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💬 Братанский</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0b0f;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100vh;
            background: #11131e;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ ===== */
        #sidebar {
            width: 320px;
            min-width: 280px;
            background: #0e0f17;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        #sidebar .header {
            padding: 16px 20px 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #sidebar .header .left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        #sidebar .header .left .avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
            flex-shrink: 0;
        }
        #sidebar .header .left .avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #sidebar .header .left .user-info {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }
        #sidebar .header .left .user-info .display-name {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 14px;
        }
        #sidebar .header .left .user-info .username {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
        #sidebar .header h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #sidebar .search {
            padding: 10px 16px;
        }
        #sidebar .search input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #sidebar .search input:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #sidebar .search input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        #chatList {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        #chatList::-webkit-scrollbar {
            width: 4px;
        }
        #chatList::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 12px;
            border-left: 3px solid transparent;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .chat-item.active {
            background: rgba(0, 212, 255, 0.06);
            border-left-color: #00d4ff;
        }
        .chat-item .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }
        .chat-item .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        .chat-item .info .name {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
        }
        .chat-item .info .last-msg {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item .time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }
        .chat-item .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .chat-item .online-dot.online {
            background: #6fcf97;
        }
        .chat-item .online-dot.offline {
            background: rgba(255, 255, 255, 0.1);
        }
        .chat-item .unread-badge {
            background: #00d4ff;
            color: #000;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0 5px;
        }
        .chat-item .admin-badge {
            font-size: 10px;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            padding: 0 6px;
            border-radius: 4px;
            margin-left: 4px;
        }

        /* ===== ПРАВАЯ ПАНЕЛЬ ===== */
        #chatArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #11131e;
            min-width: 0;
        }

        #chatHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            min-height: 68px;
            gap: 12px;
        }
        #chatHeader .chat-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            cursor: pointer;
        }
        #chatHeader .chat-left .avatar-chat {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        #chatHeader .chat-left .avatar-chat img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #chatHeader .chat-title {
            font-size: 17px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #chatHeader .chat-title small {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
            margin-left: 8px;
        }
        #chatHeader .chat-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        #chatHeader .chat-actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #chatHeader .chat-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        #chatHeader .back-btn {
            display: none;
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #messages::-webkit-scrollbar {
            width: 4px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .msg {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.2s;
            position: relative;
            cursor: default;
            transition: background 0.15s;
        }
        .msg:hover .msg-actions {
            opacity: 1;
        }
        .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .msg.deleted {
            opacity: 0.5;
            background: rgba(255, 0, 0, 0.05) !important;
            border-color: rgba(255, 0, 0, 0.1) !important;
        }
        .msg .sender {
            font-size: 11px;
            color: #00d4ffaa;
            font-weight: 600;
            margin-bottom: 3px;
            cursor: pointer;
        }
        .msg .sender:hover {
            color: #00d4ff;
        }
        .msg .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
            text-align: right;
        }
        .msg .msg-actions {
            position: absolute;
            top: -10px;
            right: -10px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }
        .msg .msg-actions button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 4px;
            transition: color 0.2s;
        }
        .msg .msg-actions button:hover {
            color: #fff;
        }
        .msg .msg-actions .delete-btn:hover {
            color: #ff4d6d;
        }
        .msg .msg-actions .edit-btn:hover {
            color: #ffd93d;
        }
        .msg .msg-actions .copy-btn:hover {
            color: #6fcf97;
        }
        .msg img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg .file-link {
            color: #00d4ff;
            text-decoration: underline;
            word-break: break-all;
            display: inline-block;
            margin-top: 2px;
        }
        .msg .edited-badge {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-left: 6px;
        }
        .msg .deleted-badge {
            font-size: 11px;
            color: #ff4d6d;
            font-style: italic;
        }
        .msg.admin-deleted {
            border: 1px solid rgba(255, 0, 0, 0.3) !important;
            background: rgba(255, 0, 0, 0.08) !important;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #inputArea {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            align-items: center;
        }
        #inputArea input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            outline: none;
            min-height: 44px;
        }
        #inputArea input[type="text"]:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #inputArea .btn-send {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
            min-height: 44px;
            min-width: 44px;
        }
        #inputArea .btn-file {
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #inputArea .btn-file:active,
        #inputArea .btn-send:active {
            transform: scale(0.94);
        }
        #fileInput {
            display: none;
        }
        #uploadStatus {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            padding: 2px 16px;
            text-align: center;
            min-height: 20px;
        }

        /* ===== ЭКРАН ВХОДА ===== */
        #loginScreen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            flex: 1;
            gap: 12px;
            background: radial-gradient(circle at center, #151725, #07080b);
        }
        #loginScreen h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loginScreen input {
            width: 100%;
            max-width: 320px;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #loginScreen input:focus {
            border-color: rgba(0, 212, 255, 0.3);
        }
        #loginScreen button {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }
        #loginScreen .error {
            color: #ff4d6d;
            font-size: 13px;
            min-height: 20px;
        }
        #loginScreen .switch {
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            cursor: pointer;
        }
        #loginScreen .switch:active {
            color: #00d4ff;
        }

        /* ===== МОДАЛЬНЫЕ ОКНА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1a1c2a;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .modal::-webkit-scrollbar {
            width: 3px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .modal h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
        }
        .modal .close-modal {
            float: right;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 24px;
            cursor: pointer;
        }
        .modal .close-modal:hover {
            color: #fff;
        }
        .modal label {
            display: block;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 4px;
            margin-top: 12px;
        }
        .modal input,
        .modal textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .modal input:focus,
        .modal textarea:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        .modal textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
        }
        .modal .btn-primary:hover {
            opacity: 0.9;
        }
        .modal .avatar-upload {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 12px 0;
        }
        .modal .avatar-upload .preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }
        .modal .avatar-upload .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal .avatar-upload .preview .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.1);
        }
        .modal .avatar-upload .upload-btn {
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 13px;
        }
        .modal .avatar-upload .upload-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .modal .profile-field {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .modal .profile-field .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
        .modal .profile-field .value {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            text-align: right;
        }
        .modal .profile-field .value.admin {
            color: #ffd700;
        }
        .modal .profile-field .value .copy-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            margin-left: 8px;
            font-size: 12px;
        }
        .modal .profile-field .value .copy-btn:hover {
            color: #6fcf97;
        }
        .modal .admin-actions {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .modal .admin-actions .btn-admin {
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            background: rgba(255, 215, 0, 0.05);
            color: #ffd700;
            cursor: pointer;
            font-size: 13px;
            margin-right: 8px;
        }
        .modal .admin-actions .btn-admin:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .modal .admin-actions .btn-admin.danger {
            border-color: rgba(255, 50, 50, 0.15);
            background: rgba(255, 50, 50, 0.05);
            color: #ff4d6d;
        }
        .modal .admin-actions .btn-admin.danger:hover {
            background: rgba(255, 50, 50, 0.1);
        }

        /* ===== ВИДЕОЗВОНОК ===== */
        #callOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #callOverlay.active {
            display: flex;
        }
        #callOverlay .call-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #0b0b0f;
        }
        #callOverlay .remote-video {
            width: 100%;
            background: #0b0b0f;
            border-radius: 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #callOverlay .remote-video video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            background: #0b0b0f;
            border-radius: 20px;
        }
        #callOverlay .remote-video .no-video {
            color: rgba(255, 255, 255, 0.2);
            font-size: 48px;
        }
        #callOverlay .local-video {
            position: absolute;
            bottom: 80px;
            right: 16px;
            width: 160px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #0b0b0f;
        }
        #callOverlay .local-video video {
            width: 100%;
            display: block;
        }
        #callOverlay .call-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        #callOverlay .call-controls button {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;

            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.15);
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(1000, audioCtx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);

        async function loadChats() {

                const { data: users, error: userError } = await sbClient
                    .from('users')
                    .select('username, last_seen')
                    .neq('username', username)
                    .order('username');

                    .from('profiles')

                const profileMap = {};

                const chatListData = [];

                renderChats();

            } catch (err) {
                console.error('Ошибка загрузки чатов:', err);
                chatList.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
            }
        }

        function renderChats(filter = '') {
            chatList.innerHTML = '';

            const generalChat = {
                id: 'general',
                name: '# Общий',
                type: 'general',
                lastMsg: 'Общий чат',
                time: null,
                online: true,
                avatar: null,
            };

            let items = [generalChat, ...chats];

            if (filter) {
                const f = filter.toLowerCase();
                items = items.filter(c => c.name.toLowerCase().includes(f) || (c.username && c.username.toLowerCase()
                .includes(f)));
            }

            if (items.length === 0) {
                chatList.innerHTML = '<div class="empty-state">👀 Ничего не найдено</div>';
                return;
            }

            items.forEach(chat => {
                const div = document.createElement('div');
                const isActive = currentChat === chat.id && currentChatType === chat.type;
                div.className = `chat-item ${isActive ? 'active' : ''}`;
                const isOnline = chat.online !== undefined ? chat.online : true;
                const unread = unreadCounts[chat.id + '_' + chat.type] || 0;

                const avatarContent = chat.avatar ?
                    `<img src="${chat.avatar}" />` :
                    (chat.type === 'general' ? '💬' : '👤');

                const adminBadge = chat.isAdmin ? `<span class="admin-badge">⭐</span>` : '';

                div.innerHTML = `
                    <div class="avatar">${avatarContent}</div>
                    <div class="info">
                        <div class="name">${chat.name} ${adminBadge}</div>
                        <div class="last-msg">${chat.lastMsg || ''}</div>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                        ${chat.time ? `<span class="time">${formatTime(chat.time)}</span>` : ''}
                        <div style="display:flex;align-items:center;gap:6px;">
                            ${chat.type === 'private' ? `<span class="online-dot ${isOnline ? 'online' : 'offline'}"></span>` : ''}
                            ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ''}
                        </div>
                    </div>
                `;

                div.addEventListener('click', () => {
                    unreadCounts[chat.id + '_' + chat.type] = 0;
                    openChat(chat.id, chat.type, chat.name, chat.username || chat.id);
                });

                chatList.appendChild(div);
            });
        }

        // ============================================================
        //  ОТКРЫТИЕ ЧАТА
        // ============================================================

        function openChat(id, type, name, usernameForProfile = null) {
            if (channel) { channel.unsubscribe();
                channel = null; }
            if (privateChannel) { privateChannel.unsubscribe();
                privateChannel = null; }
            if (pollingInterval) { clearInterval(pollingInterval);
                pollingInterval = null; }

            currentChat = id;
            currentChatType = type;
            chatTitle.textContent = name;

            // Сохраняем имя для просмотра профиля
            if (type === 'private' && usernameForProfile) {
                chatProfileBtn.dataset.username = usernameForProfile;
            } else {
                chatProfileBtn.dataset.username = '';
            }

            // Обновляем аватар в заголовке
            const chat = chats.find(c => c.id === id && c.type === type);
            const avatarEl = document.getElementById('chatAvatar');
            if (chat && chat.avatar) {
                avatarEl.innerHTML = `<img src="${chat.avatar}" />`;
            } else {
                avatarEl.innerHTML = type === 'general' ? '💬' : '👤';
            }

            msgInput.disabled = false;
            sendBtn.disabled = false;
            msgInput.focus();

            if (type === 'private') {
                callBtn.style.display = 'flex';
                videoCallBtn.style.display = 'flex';
            } else {
                callBtn.style.display = 'none';
                videoCallBtn.style.display = 'none';
            }

            if (window.innerWidth <= 768) {
                sidebar.classList.add('hidden');
            }

            if (type === 'general') {
                loadMessages('general');
                subscribeToGeneral();
                startPolling('general');
            } else {
                loadPrivateMessages(id);
                subscribeToPrivate(id);
                startPrivatePolling(id);
            }

            renderChats(searchInput.value.trim());
        }

        // ============================================================
        //  ПОЛЛИНГ
        // ============================================================

        function startPolling(room) {
            loadLastMessageId(room);
            if (pollingInterval) clearInterval(pollingInterval);

            pollingInterval = setInterval(async () => {
                try {
                    const { data, error } = await sbClient
                        .from('messages')
                        .select('*')
                        .eq('room', room)
                        .gt('id', lastMsgId)
                        .order('created_at', { ascending: true });

                    if (error) throw error;

                    if (data && data.length > 0) {
                        data.forEach(msg => {
                            if (msg.id > lastMsgId) {
                                const isOwn = msg.username === username;
                                if (!isOwn && !msg.is_deleted) {
                                    const isCurrentChat = currentChat === room && currentChatType === 'general';
                                    if (!isCurrentChat || !isPageFocused) {
                                        playNotificationSound();
                                        const key = room + '_general';
                                        unreadCounts[key] = (unreadCounts[key] || 0) + 1;
                                        if (!isPageFocused) {
                                            document.title = `💬 Новое сообщение от ${msg.username}`;
                                        }
                                    }
                                }
                                appendMessage(msg);
                                lastMsgId = msg.id;
                            }
                        });
                        renderChats(searchInput.value.trim());
                    }
                } catch (err) {}
            }, 2000);
        }

        function startPrivatePolling(target) {
            if (pollingInterval) clearInterval(pollingInterval);

            pollingInterval = setInterval(async () => {
                try {
                    const { data, error } = await sbClient
                        .from('private_messages')
                        .select('*')
                        .or(`and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username})`)
                        .gt('id', lastPrivateMsgId)
                        .order('created_at', { ascending: true });

                    if (error) throw error;

                    if (data && data.length > 0) {
                        data.forEach(msg => {
                            if (msg.id > lastPrivateMsgId) {
                                const isOwn = msg.sender === username;
                                if (!isOwn && !msg.is_deleted) {
                                    const isCurrentChat = currentChat === target && currentChatType === 'private';
                                    if (!isCurrentChat || !isPageFocused) {
                                        playNotificationSound();
                                        const key = target + '_private';
                                        unreadCounts[key] = (unreadCounts[key] || 0) + 1;
                                        if (!isPageFocused) {
                                            document.title = `💬 Новое сообщение от ${msg.sender}`;
                                        }
                                    }
                                }
                                appendPrivateMessage(msg);
                                lastPrivateMsgId = msg.id;
                            }
                        });
                        renderChats(searchInput.value.trim());
                    }
                } catch (err) {}
            }, 2000);
        }

        // ============================================================
        //  ЗАГРУЗКА СООБЩЕНИЙ
        // ============================================================

        async function loadLastMessageId(room) {
            try {
                const { data } = await sbClient
                    .from('messages')
                    .select('id')
                    .eq('room', room)
                    .order('created_at', { ascending: false })
                    .limit(1);
                lastMsgId = data && data.length > 0 ? data[0].id : 0;
            } catch (e) { lastMsgId = 0; }
        }

        async function loadMessages(room) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('messages')
                    .select('*')
                    .eq('room', room)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                if (data && data.length > 0) {
                    lastMsgId = data[data.length - 1].id;
                }

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Сообщений пока нет. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        async function loadPrivateMessages(target) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('private_messages')
                    .select('*')
                    .or(`and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username})`)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                if (data && data.length > 0) {
                    lastPrivateMsgId = data[data.length - 1].id;
                }

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Нет сообщений. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendPrivateMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки личных сообщений:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        // ============================================================
        //  ОТРИСОВКА СООБЩЕНИЙ
        // ============================================================

        function appendMessage(msg) {
            const exists = document.querySelector(`[data-msg-id="${msg.id}"]`);
            if (exists) return;

            const div = document.createElement('div');
            const isOwn = msg.username === username;
            const isDeleted = msg.is_deleted || false;

            let className = `msg ${isOwn ? 'self' : 'other'}`;
            if (isDeleted) {
                className += ' deleted';
                if (isAdmin) className += ' admin-deleted';
            }
            div.className = className;
            div.setAttribute('data-msg-id', msg.id);
            div.setAttribute('data-msg-username', msg.username || '');
            div.setAttribute('data-msg-text', msg.text || '');

            let content = '';
            if (isDeleted) {
                content = `<span class="deleted-badge">🗑️ Сообщение удалено</span>`;
                if (isAdmin) {
                    content += `<br><span style="font-size:11px;color:rgba(255,0,0,0.3);">(админ видит: ${escapeHtml(msg.text || '')})</span>`;
                }
            } else {
                if (msg.text) {
                    content += escapeHtml(msg.text);
                }
                if (msg.file_url) {
                    const ext = msg.file_url.split('.').pop().toLowerCase();
                    const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
                    const isVideo = ['mp4', 'mov', 'avi', 'webm'].includes(ext);

                    if (isImage) {
                        content += `<br><img src="${msg.file_url}" style="max-width:100%;border-radius:10px;margin-top:4px;" />`;
                    } else if (isVideo) {
                        content +=
                            `<br><video src="${msg.file_url}" controls style="max-width:100%;border-radius:10px;margin-top:4px;"></video>`;
                    } else {
                        content +=
                        `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 ${escapeHtml(msg.file_name || 'Файл')}</a>`;
                    }
                }
                if (msg.is_edited) {
                    content += `<span class="edited-badge">(ред.)</span>`;
                }
            }

            const senderName = msg.username || 'Неизвестный';

            div.innerHTML = `
                <div class="sender" onclick="viewProfile('${escapeHtml(senderName)}')">${escapeHtml(senderName)}</div>
                ${content}
                <div class="time">${formatTime(msg.created_at)}</div>
                <div class="msg-actions">
                    ${!isDeleted ? `<button class="copy-btn" onclick="copyMessage('${msg.id}')" title="Копировать">📋</button>` : ''}
                    ${!isDeleted && isOwn ? `<button class="edit-btn" onclick="editMessage('${msg.id}', 'messages')" title="Редактировать">✏️</button>` : ''}
                    ${(isOwn || isAdmin) && !isDeleted ? `<button class="delete-btn" onclick="deleteMessage('${msg.id}', 'messages')" title="Удалить">🗑️</button>` : ''}
                </div>
            `;

            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function appendPrivateMessage(msg) {
            const exists = document.querySelector(`[data-msg-id="${msg.id}"]`);
            if (exists) return;

            const div = document.createElement('div');
            const isOwn = msg.sender === username;
            const isDeleted = msg.is_deleted || false;

            let className = `msg ${isOwn ? 'self' : 'other'}`;
            if (isDeleted) {
                className += ' deleted';
                if (isAdmin) className += ' admin-deleted';
            }
            div.className = className;
            div.setAttribute('data-msg-id', msg.id);
            div.setAttribute('data-msg-sender', msg.sender || '');
            div.setAttribute('data-msg-text', msg.text || '');

            let content = '';
            if (isDeleted) {
                content = `<span class="deleted-badge">🗑️ Сообщение удалено</span>`;
                if (isAdmin) {
                    content += `<br><span style="font-size:11px;color:rgba(255,0,0,0.3);">(админ видит: ${escapeHtml(msg.text || '')})</span>`;
                }
            } else {
                if (msg.text) {
                    content += escapeHtml(msg.text);
                }
                if (msg.file_url) {
                    content += `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 Файл</a>`;
                }
                if (msg.is_edited) {
                    content += `<span class="edited-badge">(ред.)</span>`;
                }
            }

            const senderName = msg.sender || 'Неизвестный';

            div.innerHTML = `
                <div class="sender" onclick="viewProfile('${escapeHtml(senderName)}')">${isOwn ? 'Вы' : escapeHtml(senderName)}</div>
                ${content}

                <div class="msg-actions">
                    ${!isDeleted ? `<button class="copy-btn" onclick="copyMessage('${msg.id}')" title="Копировать">📋</button>` : ''}
                    ${!isDeleted && isOwn ? `<button class="edit-btn" onclick="editMessage('${msg.id}', 'private_messages')" title="Редактировать">✏️</button>` : ''}
                    ${(isOwn || isAdmin) && !isDeleted ? `<button class="delete-btn" onclick="deleteMessage('${msg.id}', 'private_messages')" title="Удалить">🗑️</button>` : ''}
                </div>
            `;

            messagesEl.appendChild(div);
            scrollToBottom();
        }

        // ============================================================
        //  ДЕЙСТВИЯ С СООБЩЕНИЯМИ
        // ============================================================

        function copyMessage(id) {
            const el = document.querySelector(`[data-msg-id="${id}"]`);
            if (!el) return;
            const text = el.dataset.msgText || '';
            if (!text) return;

            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ Текст скопирован', 'success');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
                showToast('✅ Текст скопирован', 'success');
            });
        }

        function editMessage(id, table) {
            const el = document.querySelector(`[data-msg-id="${id}"]`);
            if (!el) return;
            const text = el.dataset.msgText || '';
            if (!text) return;

            editingMsgId = id;
            editingTable = table;
            document.getElementById('editMsgInput').value = text;
            openModal('editMsgModal');
        }

        document.getElementById('saveEditMsgBtn').addEventListener('click', async () => {
            if (!editingMsgId || !editingTable) return;
            const newText = document.getElementById('editMsgInput').value.trim();
            if (!newText) return;

            try {
                const { error } = await sbClient
                    .from(editingTable)
                    .update({
                        text: newText,
                        is_edited: true
                    })
                    .eq('id', editingMsgId);

                if (error) throw error;

                // Обновляем в DOM
                const el = document.querySelector(`[data-msg-id="${editingMsgId}"]`);
                if (el) {
                    el.dataset.msgText = newText;
                    const textNode = el.querySelector('.msg-text');
                    if (textNode) {
                        textNode.textContent = newText;
                        // Добавляем пометку о редактировании
                        if (!el.querySelector('.edited-badge')) {
                            const badge = document.createElement('span');
                            badge.className = 'edited-badge';
                            badge.textContent = '(ред.)';
                            textNode.after(badge);
                        }
                    }
                }

                closeModal('editMsgModal');
                showToast('✅ Сообщение обновлено', 'success');
            } catch (err) {
                showToast('❌ ' + err.message, 'error');
            }
        });

        async function deleteMessage(id, table) {
            const confirm = window.confirm('🗑️ Удалить сообщение?');
            if (!confirm) return;

            try {
                // Для админа - полное удаление, для обычного - помечаем как удалённое
                if (isAdmin) {
                    const { error } = await sbClient
                        .from(table)
                        .delete()
                        .eq('id', id);

                    if (error) throw error;
                    showToast('✅ Сообщение удалено (админ)', 'success');
                } else {
                    const { error } = await sbClient
                        .from(table)
                        .update({
                            is_deleted: true,
                            text: ''
                        })
                        .eq('id', id);

                    if (error) throw error;
                    showToast('✅ Сообщение удалено', 'success');
                }

                // Обновляем DOM
                const el = document.querySelector(`[data-msg-id="${id}"]`);
                if (el) {
                    if (isAdmin) {
                        el.remove();
                    } else {
                        el.classList.add('deleted');
                        const content = el.querySelector('.msg-actions')?.previousElementSibling;
                        if (content) {
                            content.innerHTML =
                                `<span class="deleted-badge">🗑️ Сообщение удалено</span>`;
                        }
                        // Убираем кнопки действий
                        const actions = el.querySelector('.msg-actions');
                        if (actions) actions.innerHTML = '';
                    }
                }

                // Если админ - обновляем список удалённых
                if (isAdmin) {
                    loadDeletedMessages();
                }

            } catch (err) {
                showToast('❌ ' + err.message, 'error');
            }
        }

        // ============================================================
        //  УДАЛЁННЫЕ СООБЩЕНИЯ (АДМИН)
        // ============================================================

        async function loadDeletedMessages() {
            try {
                const [messages, privateMessages] = await Promise.all([
                    sbClient.from('messages').select('*').eq('is_deleted', true).order('created_at', { ascending: false })
                    .limit(50),
                    sbClient.from('private_messages').select('*').eq('is_deleted', true).order('created_at', { ascending: false })
                    .limit(50)
                ]);

                const list = document.getElementById('deletedMessagesList');
                list.innerHTML = '';

                const all = [...(messages.data || []), ...(privateMessages.data || [])];
                all.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                if (all.length === 0) {
                    list.innerHTML =
                    '<div style="text-align:center;color:rgba(255,255,255,0.1);padding:20px;">Нет удалённых сообщений</div>';
                } else {
                    all.forEach(msg => {
                        const div = document.createElement('div');
                        div.style.cssText =
                            'padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;';
                        const sender = msg.username || msg.sender || 'Неизвестный';
                        const table = msg.username ? 'общий' : 'личный';
                        div.innerHTML = `
                            <span style="color:#ff4d6d;">🗑️</span>
                            <span style="color:rgba(255,255,255,0.3);">${sender}</span>
                            <span style="color:rgba(255,255,255,0.1);">[${table}]</span>
                            <span style="color:rgba(255,255,255,0.5);">${escapeHtml(msg.text || '(пусто)')}</span>
                            <span style="color:rgba(255,255,255,0.1);font-size:11px;float:right;">${formatTime(msg.created_at)}</span>
                        `;
                        list.appendChild(div);
                    });
                }

                openModal('deletedMessagesModal');

            } catch (err) {
                showToast('❌ ' + err.message, 'error');
            }
        }

        // ============================================================
        //  ПРОФИЛЬ
        // ============================================================

        async function viewProfile(usernameToView) {
            if (!usernameToView || usernameToView === username) {
                // Свой профиль
                openMyProfile();
                return;
            }

            try {
                const { data: user, error } = await sbClient
                    .from('users')
                    .select('*')
                    .eq('username', usernameToView)
                    .single();

                if (error) throw error;

                const { data: profile, error: pError } = await sbClient
                    .from('profiles')
                    .select('*')
                    .eq('user_id', user.id)
                    .single();

                if (pError && pError.code !== 'PGRST116') throw pError;

                viewingProfileUsername = usernameToView;

                // Заполняем модалку
                document.getElementById('profileModalTitle').textContent = `👤 ${profile?.display_name || usernameToView}`;

                // Аватар
                const preview = document.getElementById('profileAvatarPreview');
                if (profile?.avatar_url) {
                    preview.innerHTML = `<img src="${profile.avatar_url}" />`;
                } else {
                    preview.innerHTML = `<div class="placeholder">👤</div>`;
                }

                // Скрываем поля редактирования
                document.getElementById('profileDisplayName').style.display = 'none';
                document.getElementById('profileBio').style.display = 'none';
                document.getElementById('saveProfileBtn').style.display = 'none';
                document.getElementById('uploadAvatarBtn').style.display = 'none';

                // Информация
                const fields = document.getElementById('profileFields');
                fields.innerHTML = '';
                const addField = (label, value, isAdminField = false) => {
                    const div = document.createElement('div');
                    div.className = 'profile-field';
                    const val = document.createElement('span');
                    val.className = `value${isAdminField ? ' admin' : ''}`;
                    val.textContent = value || '—';
                    if (isAdminField && isAdmin) {
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-btn';
                        copyBtn.textContent = '📋';
                        copyBtn.onclick = () => {
                            navigator.clipboard.writeText(value || '').then(() => {
                                showToast('✅ Скопировано', 'success');
                            });
                        };
                        val.appendChild(copyBtn);
                    }
                    div.innerHTML = `<span class="label">${label}</span>`;
                    div.appendChild(val);
                    fields.appendChild(div);
                };

                addField('@username', usernameToView);
                if (profile) {
                    addField('Отображаемое имя', profile.display_name || usernameToView);
                    addField('О себе', profile.bio || '—');
                }

                // Админ-инфа
                if (isAdmin) {
                    addField('🛡️ Админ', profile?.is_admin ? '✅ Да' : '❌ Нет', true);
                    addField('🔑 Пароль', user.password || '—', true);
                    addField('🖥️ IP', user.ip || 'не сохранён', true);
                }

                // Админ-действия
                const adminActions = document.getElementById('adminActions');
                adminActions.style.display = isAdmin ? 'block' : 'none';
                adminActions.innerHTML = '';

                if (isAdmin && profile) {
                    if (!profile.is_admin) {
                        const btn = document.createElement('button');
                        btn.className = 'btn-admin';
                        btn.textContent = '⭐ Сделать админом';
                        btn.onclick = () => makeAdmin(usernameToView);
                        adminActions.appendChild(btn);

        // ============================================================

        async function sendMessage(text, fileUrl = null, fileName = null) {
            if (!text && !fileUrl) return;
            if (!username) return;

            try {
                if (currentChatType === 'general') {
                    const { data, error } = await sbClient
                        .from('messages')
                        .insert([{
                            username: username,
                            room: currentChat,
                            text: text || null,
                            file_url: fileUrl || null,
                            file_name: fileName || null,
                            is_deleted: false,
                            is_edited: false,
                        }])
                        .select();

                    if (error) throw error;

                    if (data && data.length > 0) {
                        appendMessage(data[0]);
                        lastMsgId = data[0].id;
                    }

                } else {
                    const { data, error } = await sbClient
                        .from('private_messages')
                        .insert([{
                            sender: username,
                            receiver: currentChat,
                            text: text || null,
                            file_url: fileUrl || null,
                            file_name: fileName || null,
                            is_deleted: false,
                            is_edited: false,
                        }])
                        .select();

                    if (error) throw error;

                    if (data && data.length > 0) {
                        appendPrivateMessage(data[0]);
                        lastPrivateMsgId = data[0].id;
                    }

                    setTimeout(loadChats, 500);
                }

                msgInput.value = '';
                msgInput.focus();
                scrollToBottom();

            } catch (err) {
                console.error('Ошибка отправки:', err);
                uploadStatus.textContent = '❌ ' + err.message;
                uploadStatus.style.color = '#ff4d6d';
                setTimeout(() => {
                    uploadStatus.textContent = '';
                }, 3000);
            }
        }

        async function uploadFiles(files) {
            if (!files || files.length === 0) return;

            for (const file of files) {
                uploadStatus.textContent = `⏫ Загрузка: ${file.name} ...`;
                uploadStatus.style.color = '#ffd93d';

                try {
                    const path = `chats/${Date.now()}_${file.name}`;
                    const { error: uploadError } = await sbClient.storage
                        .from(BUCKET)
                        .upload(path, file, {
                            contentType: file.type,
                            cacheControl: '3600',
                        });

                    if (uploadError) throw uploadError;

                    const { data: urlData } = sbClient.storage
                        .from(BUCKET)
                        .getPublicUrl(path);

                    await sendMessage('', urlData.publicUrl, file.name);

                    uploadStatus.textContent = `✅ ${file.name} загружен`;
                    uploadStatus.style.color = '#6fcf97';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 2000);

                } catch (err) {
                    console.error('Ошибка загрузки файла:', err);
                    uploadStatus.textContent = `❌ ${file.name}: ${err.message}`;
                    uploadStatus.style.color = '#ff4d6d';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 3000);
                }
            }
        }

        function subscribeToGeneral() {
            if (channel) {
                try { channel.unsubscribe(); } catch (e) {}
                channel = null;
            }

            channel = sbClient
                .channel(`messages-${currentChat}`)
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'messages',
                    filter: `room=eq.${currentChat}`,
                }, (payload) => {
                    const msg = payload.new;
                    console.log('⚡ Realtime общее:', payload);

                    if (payload.eventType === 'INSERT') {
                        if (msg.username !== username && msg.id > lastMsgId) {
                            const isCurrentChat = currentChat === 'general' && currentChatType === 'general';
                            if (!isCurrentChat || !isPageFocused) {
                                playNotificationSound();
                                const key = 'general_general';
                                unreadCounts[key] = (unreadCounts[key] || 0) + 1;
                                if (!isPageFocused) {
                                    document.title = `💬 Новое сообщение от ${msg.username}`;
                                }
                            }
                            appendMessage(msg);
                            lastMsgId = msg.id;
                            renderChats(searchInput.value.trim());
                        }
                    } else if (payload.eventType === 'UPDATE') {
                        // Обновляем сообщение
                        const el = document.querySelector(`[data-msg-id="${msg.id}"]`);
                        if (el) {
                            el.dataset.msgText = msg.text || '';
                            const content = el.querySelector('.deleted-badge')?.parentElement || el;
                            if (msg.is_deleted) {
                                content.innerHTML = `<span class="deleted-badge">🗑️ Сообщение удалено</span>`;
                                if (isAdmin) {
                                    content.innerHTML +=
                                        `<br><span style="font-size:11px;color:rgba(255,0,0,0.3);">(админ видит: ${escapeHtml(msg.text || '')})</span>`;
                                }
                                el.classList.add('deleted');
                                if (isAdmin) el.classList.add('admin-deleted');
                                const actions = el.querySelector('.msg-actions');
                                if (actions) actions.innerHTML = '';
                            } else {
                                // Обновление текста
                                const textNode = content.querySelector('.msg-text');
                                if (textNode) {
                                    textNode.textContent = msg.text || '';
                                }
                            }
                        }
                    } else if (payload.eventType === 'DELETE') {
                        const el = document.querySelector(`[data-msg-id="${payload.old.id}"]`);
                        if (el) el.remove();
                    }
                })
                .subscribe((status) => {
                    console.log(`📡 Realtime общий статус:`, status);
                    if (status === 'CHANNEL_ERROR' || status === 'closed') {
                        setTimeout(() => subscribeToGeneral(), 3000);
                    }
                });
        }

        // ============================================================
        //  СИГНАЛИНГ (ЗВОНКИ)
        // ============================================================

        function subscribeToSignaling() {
            if (signalingChannel) {
                signalingChannel.unsubscribe();
                signalingChannel = null;
            }

            signalingChannel = sbClient
                .channel(`signaling-${username}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'signaling',
                    filter: `receiver=eq.${username}`
                }, async (payload) => {
                    const data = JSON.parse(payload.new.data);
                    console.log('📡 Сигнальное:', data);

                    if (!isCallActive && data.type === 'offer') {
                        handleIncomingCall(data);
                    } else if (isCallActive && peerConnection) {
                        if (data.type === 'answer') {
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                            document.getElementById('callStatus').textContent = 'Соединено';
                        } else if (data.type === 'candidate') {
                            try {
                                await peerConnection.addIceCandidate(data.candidate);
                            } catch (e) {}
                        } else if (data.type === 'busy') {
                            document.getElementById('callStatus').textContent = 'Собеседник занят';
                            setTimeout(endCall, 2000);
                        } else if (data.type === 'end') {
                            document.getElementById('callStatus').textContent = 'Собеседник завершил звонок';
                            setTimeout(endCall, 1000);
                        }
                    }
                })
                .subscribe((status) => {
                    console.log('📡 Signaling статус:', status);
                });
        }

        function scrollToBottom() {

                messagesEl.scrollTop = messagesEl.scrollHeight;
            }, 100);
        }

        function formatTime(date) {
            if (!date) return '';
            const d = new Date(date);
            const now = new Date();
            const diff = (now - d) / 1000 / 60;
            if (diff < 1) return 'только что';
            if (diff < 60) return Math.floor(diff) + 'м';
            if (diff < 1440) return Math.floor(diff / 60) + 'ч';
            return d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  ЗВОНКИ (WebRTC)
        // ============================================================

        let peerConnection = null;
        let localStream = null;
        let callType = 'audio';
        let isCallActive = false;
        let isMuted = false;
        let isVideoOff = false;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
            ]
        };

        async function startCall(type) {
            if (isCallActive) return;
            if (!currentChat || currentChatType !== 'private') {
                showToast('❌ Звонки только в личных чатах', 'error');
                return;
            }

            callType = type;
            isCallActive = true;

            try {
                const constraints = {
                    audio: true,
                    video: type === 'video'
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(configuration);

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                    document.getElementById('noRemoteVideo').style.display = 'none';
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        sendSignalingData({
                            type: 'candidate',
                            candidate: event.candidate,
                            target: currentChat,
                            sender: username
                        });
                    }
                };

                peerConnection.onconnectionstatechange = () => {
                    const status = document.getElementById('callStatus');
                    switch (peerConnection.connectionState) {
                        case 'connecting':
                            status.textContent = 'Подключение...';
                            break;
                        case 'connected':
                            status.textContent = 'Соединено';
                            break;
                        case 'disconnected':
                            status.textContent = 'Разъединено';
                            break;
                        case 'failed':
                            status.textContent = 'Ошибка соединения';
                            break;
                        case 'closed':
                            status.textContent = 'Закрыто';
                            break;
                    }
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                await sendSignalingData({
                    type: 'offer',
                    offer: offer,
                    target: currentChat,
                    sender: username,
                    callType: type
                });

                document.getElementById('callOverlay').classList.add('active');
                document.getElementById('callPartnerName').textContent = currentChat;
                document.getElementById('callStatus').textContent = 'Ожидание ответа...';

            } catch (err) {
                console.error('Ошибка звонка:', err);
                showToast('❌ ' + err.message, 'error');
                endCall();
            }
        }

        async function handleIncomingCall(data) {
            if (isCallActive) {
                await sendSignalingData({
                    type: 'busy',
                    target: data.sender,
                    sender: username
                });
                return;
            }

            callType = data.callType || 'audio';
            isCallActive = true;

            try {
                const constraints = {
                    audio: true,
                    video: callType === 'video'
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(configuration);

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                    document.getElementById('noRemoteVideo').style.display = 'none';
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        sendSignalingData({
                            type: 'candidate',
                            candidate: event.candidate,
                            target: data.sender,
                            sender: username
                        });
                    }
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await sendSignalingData({
                    type: 'answer',
                    answer: answer,
                    target: data.sender,
                    sender: username
                });

                document.getElementById('callOverlay').classList.add('active');
                document.getElementById('callPartnerName').textContent = data.sender;
                document.getElementById('callStatus').textContent = 'Соединение...';

            } catch (err) {
                console.error('Ошибка ответа:', err);
                endCall();
            }
        }

        function endCall() {
            isCallActive = false;

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('noRemoteVideo').style.display = 'flex';
            document.getElementById('callOverlay').classList.remove('active');
        }

        async function sendSignalingData(data) {
            try {
                await sbClient
                    .from('signaling')
                    .insert([{
                        sender: data.sender,
                        receiver: data.target,
                        type: data.type,
                        data: JSON.stringify(data)
                    }]);
            } catch (err) {
                console.error('Ошибка отправки сигнальных данных:', err);
            }
        }

        });

        // Выход
        logoutBtn.addEventListener('click', () => {
            if (channel) { channel.unsubscribe();
                channel = null; }
            if (privateChannel) { privateChannel.unsubscribe();
                privateChannel = null; }
            if (signalingChannel) { signalingChannel.unsubscribe();
                signalingChannel = null; }
            if (pollingInterval) { clearInterval(pollingInterval);
                pollingInterval = null; }
            clearSession();
            username = '';
            userId = null;
            mainUI.style.display = 'none';
            loginScreen.style.display = 'flex';
            messagesEl.innerHTML = '';
            loginUsername.value = '';
            loginPassword.value = '';
            loginError.textContent = '';
            currentChat = null;
            currentChatType = 'general';
            chatTitle.textContent = 'Выберите чат';
            msgInput.disabled = true;
            sendBtn.disabled = true;
            callBtn.style.display = 'none';
            videoCallBtn.style.display = 'none';
            isAdmin = false;
        });

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        const hasSession = checkSession();

        if (!hasSession) {
            loginScreen.style.display = 'flex';
            mainUI.style.display = 'none';
        }

        console.log('💬 Братанский мессенджер v2.0');
        console.log('👤 Профили с аватарками и описанием');
        console.log('✏️ Редактирование и удаление сообщений');
        console.log('👑 Админ-панель (kosholka)');
        console.log('📞 Аудио и видео звонки');
        console.log('🔔 Звук уведомлений');
        console.log('📱 Адаптив под телефон и компьютер');
    </script>
</body>
</html>
