<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💬 Братанский</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0b0f;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 700px;
            background: #11131e;
            border-radius: 0;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        @media (min-width:600px) {
            #app {
                border-radius: 24px;
                height: 90vh;
            }
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ (список чатов) ===== */
        #sidebar {
            width: 280px;
            min-width: 200px;
            background: #0e0f17;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        #sidebar .header {
            padding: 16px 16px 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        #sidebar .header h2 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #sidebar .header .user-info {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 4px;
        }

        #sidebar .search {
            padding: 8px 12px;
        }
        #sidebar .search input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        #sidebar .search input:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #sidebar .search input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        #chatList {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        #chatList::-webkit-scrollbar {
            width: 3px;
        }
        #chatList::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 12px;
            border-left: 3px solid transparent;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .chat-item.active {
            background: rgba(0, 212, 255, 0.05);
            border-left-color: #00d4ff;
        }
        .chat-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        .chat-item .info .name {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }
        .chat-item .info .last-msg {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        .chat-item .badge {
            background: #00d4ff;
            color: #000;
            border-radius: 50%;
            padding: 0 6px;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-item .logout-btn {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.1);
            border-radius: 20px;
            padding: 4px 14px;
            color: #ff4d6d;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
        }

        /* ===== ПРАВАЯ ПАНЕЛЬ (чат) ===== */
        #chatArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #11131e;
            min-width: 0;
        }

        #chatHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            min-height: 60px;
        }
        #chatHeader .chat-title {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
        }
        #chatHeader .chat-title small {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            margin-left: 8px;
        }
        #chatHeader button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 4px 14px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            cursor: pointer;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #messages::-webkit-scrollbar {
            width: 3px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.2s;
        }
        .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .msg .sender {
            font-size: 10px;
            color: #00d4ffaa;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .msg .time {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 2px;
            text-align: right;
        }
        .msg img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg .file-link {
            color: #00d4ff;
            text-decoration: underline;
            word-break: break-all;
            display: inline-block;
            margin-top: 2px;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #inputArea {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            align-items: center;
        }
        #inputArea input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #inputArea input[type="text"]:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #inputArea .btn-send {
            padding: 10px 18px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #inputArea .btn-file {
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #inputArea .btn-file:active,
        #inputArea .btn-send:active {
            transform: scale(0.94);
        }
        #fileInput {
            display: none;
        }
        #uploadStatus {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            padding: 2px 12px;
            text-align: center;
            min-height: 16px;
        }

        /* ===== ЭКРАН ВХОДА ===== */
        #loginScreen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            flex: 1;
            gap: 12px;
            background: radial-gradient(circle at center, #151725, #07080b);
        }
        #loginScreen h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loginScreen input {
            width: 100%;
            max-width: 300px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #loginScreen input:focus {
            border-color: rgba(0, 212, 255, 0.3);
        }
        #loginScreen button {
            width: 100%;
            max-width: 300px;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        #loginScreen .error {
            color: #ff4d6d;
            font-size: 13px;
            min-height: 20px;
        }
        #loginScreen .switch {
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            cursor: pointer;
        }
        #loginScreen .switch:active {
            color: #00d4ff;
        }

        /* ===== АДАПТИВ (мобилка) ===== */
        @media (max-width: 600px) {
            #sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            }
            #app {
                flex-direction: column;
                max-height: 100vh;
                border-radius: 0;
            }
            #chatArea {
                display: none;
            }
            #chatArea.open {
                display: flex;
            }
            #sidebar .mobile-back {
                display: block;
            }
            .chat-item .mobile-back {
                display: none;
            }
        }
        .mobile-back {
            display: none;
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.05);
            padding: 30px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- ===== ЭКРАН ВХОДА ===== -->
        <div id="loginScreen">
            <h1>💬 Братанский</h1>
            <p style="color:rgba(255,255,255,0.2);font-size:13px;" id="loginTitle">Вход в аккаунт</p>
            <input id="loginUsername" type="text" placeholder="Имя пользователя" />
            <input id="loginPassword" type="password" placeholder="Пароль" />
            <div class="error" id="loginError"></div>
            <button id="loginBtn">ВОЙТИ</button>
            <span class="switch" id="switchAuth">Нет аккаунта? Зарегистрироваться</span>
        </div>

        <!-- ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== -->
        <div id="mainUI" style="display:none;width:100%;height:100%;">

            <!-- ЛЕВАЯ ПАНЕЛЬ -->
            <div id="sidebar">
                <div class="header">
                    <h2>💬 Братанский</h2>
                    <div class="user-info" id="sidebarUser">—</div>
                </div>
                <div class="search">
                    <input id="searchInput" type="text" placeholder="🔍 Поиск..." />
                </div>
                <div id="chatList">
                    <div class="empty-state">Загрузка...</div>
                </div>
                <div style="padding:8px 12px;border-top:1px solid rgba(255,255,255,0.04);">
                    <button id="logoutBtn" style="width:100%;padding:8px;border-radius:20px;border:1px solid rgba(255,50,50,0.1);background:rgba(255,50,50,0.05);color:#ff4d6d;font-size:12px;cursor:pointer;">🚪 Выйти</button>
                </div>
            </div>

            <!-- ПРАВАЯ ПАНЕЛЬ (чат) -->
            <div id="chatArea">
                <div id="chatHeader">
                    <div>
                        <button class="mobile-back" id="mobileBack">←</button>
                        <span class="chat-title" id="chatTitle">Выберите чат</span>
                    </div>
                    <span style="font-size:11px;color:rgba(255,255,255,0.1);" id="chatStatus">онлайн</span>
                </div>
                <div id="messages">
                    <div class="empty-state">👈 Выберите чат слева</div>
                </div>
                <div id="uploadStatus"></div>
                <div id="inputArea">
                    <button class="btn-file" id="fileBtn">📎</button>
                    <input id="fileInput" type="file" multiple />
                    <input id="msgInput" type="text" placeholder="Напиши что-то..." disabled />
                    <button class="btn-send" id="sendBtn" disabled>→</button>
                </div>
            </div>

        </div>

    </div>

    <script>
        // ============================================================
        //  ⚡ ТВОИ ДАННЫЕ SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://uxjoowanhrmbrnqtghyc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3Dzhz17WLtHl1jguQlGNTQ_gu2REAg6';
        const BUCKET = 'chat-files';
        // ============================================================

        // ===== СОЗДАЕМ КЛИЕНТ С НАСТРОЙКАМИ ДЛЯ WEBSOCKET =====
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            realtime: {
                params: {
                    eventsPerSecond: 10,
                    heartbeatIntervalMs: 5000,
                },
                reconnectAfterMs: function(attempts) {
                    return Math.min(1000 * Math.pow(2, attempts), 30000);
                }
            }
        });

        // ---------- ЭЛЕМЕНТЫ ----------
        const loginScreen = document.getElementById('loginScreen');
        const mainUI = document.getElementById('mainUI');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const switchAuth = document.getElementById('switchAuth');
        const loginTitle = document.getElementById('loginTitle');
        const logoutBtn = document.getElementById('logoutBtn');
        const sidebarUser = document.getElementById('sidebarUser');
        const chatList = document.getElementById('chatList');
        const chatTitle = document.getElementById('chatTitle');
        const chatStatus = document.getElementById('chatStatus');
        const messagesEl = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const searchInput = document.getElementById('searchInput');
        const mobileBack = document.getElementById('mobileBack');

        // ---------- СОСТОЯНИЕ ----------
        let username = '';
        let userId = null;
        let currentChat = null; // 'general' или ник пользователя
        let currentChatType = 'general'; // 'general' или 'private'
        let channel = null;
        let privateChannel = null;
        let isSubscribed = false;
        let isLoginMode = true;
        let allUsers = [];
        let chats = [];
        let isMobile = window.innerWidth <= 600;

        // ===== НОВЫЕ ПЕРЕМЕННЫЕ ДЛЯ ПОЛЛИНГА =====
        let pollingInterval = null;
        let lastMsgId = 0;
        let lastPrivateMsgId = 0;

        // ============================================================
        //  АВТОРИЗАЦИЯ
        // ============================================================

        function checkSession() {
            try {
                const saved = localStorage.getItem('boss_chat_session');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.username && data.userId) {
                        username = data.username;
                        userId = data.userId;
                        loginScreen.style.display = 'none';
                        mainUI.style.display = 'flex';
                        sidebarUser.textContent = username;
                        loadChats();
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        function saveSession() {
            try {
                localStorage.setItem('boss_chat_session', JSON.stringify({
                    username: username,
                    userId: userId
                }));
            } catch (e) {}
        }

        function clearSession() {
            localStorage.removeItem('boss_chat_session');
        }

        async function register() {
            const name = loginUsername.value.trim();
            const pass = loginPassword.value.trim();

            if (!name || name.length < 2) {
                loginError.textContent = '❌ Имя минимум 2 символа';
                return;
            }
            if (!pass || pass.length < 4) {
                loginError.textContent = '❌ Пароль минимум 4 символа';
                return;
            }

            try {
                const { data: existing } = await sbClient
                    .from('users')
                    .select('id')
                    .eq('username', name);

                if (existing && existing.length > 0) {
                    loginError.textContent = '❌ Пользователь уже существует';
                    return;
                }

                const { data, error } = await sbClient
                    .from('users')
                    .insert([{
                        username: name,
                        password: pass,
                        last_seen: new Date().toISOString(),
                    }])
                    .select();

                if (error) throw error;

                username = name;
                userId = data[0].id;
                saveSession();
                loginScreen.style.display = 'none';
                mainUI.style.display = 'flex';
                sidebarUser.textContent = username;
                loadChats();
                loginError.textContent = '';

            } catch (err) {
                loginError.textContent = '❌ ' + err.message;
            }
        }

        async function login() {
            const name = loginUsername.value.trim();
            const pass = loginPassword.value.trim();

            if (!name || !pass) {
                loginError.textContent = '❌ Заполни все поля';
                return;
            }

            try {
                const { data, error } = await sbClient
                    .from('users')
                    .select('*')
                    .eq('username', name)
                    .eq('password', pass);

                if (error) throw error;

                if (!data || data.length === 0) {
                    loginError.textContent = '❌ Неверный логин или пароль';
                    return;
                }

                username = name;
                userId = data[0].id;

                await sbClient
                    .from('users')
                    .update({ last_seen: new Date().toISOString() })
                    .eq('id', userId);

                saveSession();
                loginScreen.style.display = 'none';
                mainUI.style.display = 'flex';
                sidebarUser.textContent = username;
                loadChats();
                loginError.textContent = '';

            } catch (err) {
                loginError.textContent = '❌ ' + err.message;
            }
        }

        logoutBtn.addEventListener('click', () => {
            if (channel) { channel.unsubscribe();
                channel = null; }
            if (privateChannel) { privateChannel.unsubscribe();
                privateChannel = null; }
            if (pollingInterval) { clearInterval(pollingInterval);
                pollingInterval = null; }
            clearSession();
            username = '';
            userId = null;
            mainUI.style.display = 'none';
            loginScreen.style.display = 'flex';
            messagesEl.innerHTML = '';
            loginUsername.value = '';
            loginPassword.value = '';
            loginError.textContent = '';
            currentChat = null;
            currentChatType = 'general';
            chatTitle.textContent = 'Выберите чат';
            msgInput.disabled = true;
            sendBtn.disabled = true;
        });

        switchAuth.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            loginTitle.textContent = isLoginMode ? 'Вход в аккаунт' : 'Регистрация нового аккаунта';
            loginBtn.textContent = isLoginMode ? 'ВОЙТИ' : 'ЗАРЕГИСТРИРОВАТЬСЯ';
            switchAuth.textContent = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
            loginError.textContent = '';
        });

        loginBtn.addEventListener('click', () => {
            if (isLoginMode) login();
            else register();
        });

        loginUsername.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginPassword.focus();
        });
        loginPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // ============================================================
        //  ЗАГРУЗКА ЧАТОВ
        // ============================================================

        async function loadChats() {
            try {
                const { data: users, error: userError } = await sbClient
                    .from('users')
                    .select('username, last_seen')
                    .neq('username', username)
                    .order('username');

                if (userError) throw userError;

                allUsers = users || [];

                const chatListData = [];
                for (const u of allUsers) {
                    const { data: msgs } = await sbClient
                        .from('private_messages')
                        .select('text, created_at, sender')
                        .or(`and(sender.eq.${username},receiver.eq.${u.username}),and(sender.eq.${u.username},receiver.eq.${username})`)
                        .order('created_at', { ascending: false })
                        .limit(1);

                    if (msgs && msgs.length > 0) {
                        const last = msgs[0];
                        chatListData.push({
                            id: u.username,
                            name: u.username,
                            type: 'private',
                            lastMsg: last.sender === username ? 'Вы: ' + (last.text || 'Файл') : last.text || 'Файл',
                            time: last.created_at,
                            online: Date.now() - new Date(u.last_seen).getTime() < 60000
                        });
                    } else {
                        chatListData.push({
                            id: u.username,
                            name: u.username,
                            type: 'private',
                            lastMsg: 'Нет сообщений',
                            time: null,
                            online: Date.now() - new Date(u.last_seen).getTime() < 60000
                        });
                    }
                }

                chatListData.sort((a, b) => {
                    if (!a.time) return 1;
                    if (!b.time) return -1;
                    return new Date(b.time) - new Date(a.time);
                });

                chats = chatListData;
                renderChats();

            } catch (err) {
                console.error('Ошибка загрузки чатов:', err);
                chatList.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
            }
        }

        function renderChats(filter = '') {
            chatList.innerHTML = '';

            const generalChat = {
                id: 'general',
                name: '# Общий',
                type: 'general',
                lastMsg: 'Общий чат',
                time: null,
                online: true
            };

            let items = [generalChat, ...chats];

            if (filter) {
                const f = filter.toLowerCase();
                items = items.filter(c => c.name.toLowerCase().includes(f));
            }

            if (items.length === 0) {
                chatList.innerHTML = '<div class="empty-state">👀 Ничего не найдено</div>';
                return;
            }

            items.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${currentChat === chat.id && currentChatType === chat.type ? 'active' : ''}`;
                const isOnline = chat.online !== undefined ? chat.online : true;

                div.innerHTML = `
                    <div class="avatar">${chat.type === 'general' ? '💬' : '👤'}</div>
                    <div class="info">
                        <div class="name">${chat.name}</div>
                        <div class="last-msg">${chat.lastMsg || ''}</div>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                        ${chat.time ? `<span class="time">${formatTime(chat.time)}</span>` : ''}
                        ${chat.type === 'private' ? `<span style="font-size:8px;color:${isOnline ? '#6fcf97' : 'rgba(255,255,255,0.1)'};">${isOnline ? '🟢' : '⚫'}</span>` : ''}
                    </div>
                `;

                div.addEventListener('click', () => {
                    openChat(chat.id, chat.type, chat.name);
                });

                chatList.appendChild(div);
            });
        }

        // ============================================================
        //  ОТКРЫТИЕ ЧАТА
        // ============================================================

        function openChat(id, type, name) {
            // Отписываемся от старого
            if (channel) { channel.unsubscribe();
                channel = null; }
            if (privateChannel) { privateChannel.unsubscribe();
                privateChannel = null; }
            if (pollingInterval) { clearInterval(pollingInterval);
                pollingInterval = null; }
            isSubscribed = false;

            currentChat = id;
            currentChatType = type;
            chatTitle.textContent = name;

            msgInput.disabled = false;
            sendBtn.disabled = false;
            msgInput.focus();

            if (window.innerWidth <= 600) {
                document.getElementById('chatArea').classList.add('open');
                document.getElementById('sidebar').style.display = 'none';
            }

            if (type === 'general') {
                loadMessages('general');
                subscribeToGeneral();
                startPolling('general');
            } else {
                loadPrivateMessages(id);
                subscribeToPrivate(id);
                startPrivatePolling(id);
            }

            renderChats(searchInput.value.trim());
        }

        // ============================================================
        //  ===== НОВЫЙ ПОЛЛИНГ ДЛЯ ОБЩЕГО ЧАТА =====
        // ============================================================

        function startPolling(room) {
            // Сначала загружаем последний ID
            loadLastMessageId(room);
            
            if (pollingInterval) clearInterval(pollingInterval);
            
            pollingInterval = setInterval(async () => {
                try {
                    const { data, error } = await sbClient
                        .from('messages')
                        .select('*')
                        .eq('room', room)
                        .gt('id', lastMsgId)
                        .order('created_at', { ascending: true });
                    
                    if (error) throw error;
                    
                    if (data && data.length > 0) {
                        console.log(`📩 Polling: ${data.length} новых сообщений`);
                        data.forEach(msg => {
                            if (msg.id > lastMsgId) {
                                if (msg.username !== username) {
                                    appendMessage(msg);
                                }
                                lastMsgId = msg.id;
                            }
                        });
                    }
                } catch (err) {
                    // Игнорируем ошибки
                }
            }, 2000);
        }

        // ===== НОВЫЙ ПОЛЛИНГ ДЛЯ ЛИЧНЫХ СООБЩЕНИЙ =====

        function startPrivatePolling(target) {
            if (pollingInterval) clearInterval(pollingInterval);
            
            pollingInterval = setInterval(async () => {
                try {
                    const { data, error } = await sbClient
                        .from('private_messages')
                        .select('*')
                        .or(`and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username})`)
                        .gt('id', lastPrivateMsgId)
                        .order('created_at', { ascending: true });
                    
                    if (error) throw error;
                    
                    if (data && data.length > 0) {
                        console.log(`📩 Private Polling: ${data.length} новых сообщений`);
                        data.forEach(msg => {
                            if (msg.id > lastPrivateMsgId) {
                                if (msg.sender !== username) {
                                    appendPrivateMessage(msg);
                                }
                                lastPrivateMsgId = msg.id;
                            }
                        });
                    }
                } catch (err) {
                    // Игнорируем ошибки
                }
            }, 2000);
        }

        // ===== ЗАГРУЗКА ПОСЛЕДНЕГО ID ДЛЯ ОБЩЕГО ЧАТА =====

        async function loadLastMessageId(room) {
            try {
                const { data } = await sbClient
                    .from('messages')
                    .select('id')
                    .eq('room', room)
                    .order('created_at', { ascending: false })
                    .limit(1);
                
                if (data && data.length > 0) {
                    lastMsgId = data[0].id;
                } else {
                    lastMsgId = 0;
                }
                console.log(`📌 Last message ID для ${room}: ${lastMsgId}`);
            } catch(e) {
                console.error('Ошибка загрузки lastMsgId:', e);
                lastMsgId = 0;
            }
        }

        // ===== ЗАГРУЗКА ПОСЛЕДНЕГО ID ДЛЯ ЛИЧНЫХ СООБЩЕНИЙ =====

        async function loadLastPrivateMessageId(target) {
            try {
                const { data } = await sbClient
                    .from('private_messages')
                    .select('id')
                    .or(`and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username})`)
                    .order('created_at', { ascending: false })
                    .limit(1);
                
                if (data && data.length > 0) {
                    lastPrivateMsgId = data[0].id;
                } else {
                    lastPrivateMsgId = 0;
                }
                console.log(`📌 Last private message ID для ${target}: ${lastPrivateMsgId}`);
            } catch(e) {
                console.error('Ошибка загрузки lastPrivateMsgId:', e);
                lastPrivateMsgId = 0;
            }
        }

        // ============================================================
        //  ЗАГРУЗКА ОБЩИХ СООБЩЕНИЙ
        // ============================================================

        async function loadMessages(room) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('messages')
                    .select('*')
                    .eq('room', room)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                // Обновляем lastMsgId
                if (data && data.length > 0) {
                    lastMsgId = data[data.length - 1].id;
                }

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Сообщений пока нет. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        // ============================================================
        //  ЗАГРУЗКА ЛИЧНЫХ СООБЩЕНИЙ
        // ============================================================

        async function loadPrivateMessages(target) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('private_messages')
                    .select('*')
                    .or(`and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username})`)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                // Обновляем lastPrivateMsgId
                if (data && data.length > 0) {
                    lastPrivateMsgId = data[data.length - 1].id;
                }

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Нет сообщений. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendPrivateMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки личных сообщений:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        // ============================================================
        //  ОТРИСОВКА СООБЩЕНИЙ
        // ============================================================

        function appendMessage(msg) {
            // Проверяем, нет ли уже такого сообщения
            const exists = document.querySelector(`[data-msg-id="${msg.id}"]`);
            if (exists) return;

            const div = document.createElement('div');
            div.className = `msg ${msg.username === username ? 'self' : 'other'}`;
            div.setAttribute('data-msg-id', msg.id);

            let content = '';
            if (msg.text) {
                content += escapeHtml(msg.text);
            }
            if (msg.file_url) {
                const ext = msg.file_url.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
                const isVideo = ['mp4', 'mov', 'avi', 'webm'].includes(ext);

                if (isImage) {
                    content += `<br><img src="${msg.file_url}" style="max-width:100%;border-radius:10px;margin-top:4px;" />`;
                } else if (isVideo) {
                    content +=
                        `<br><video src="${msg.file_url}" controls style="max-width:100%;border-radius:10px;margin-top:4px;"></video>`;
                } else {
                    content += `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 ${escapeHtml(msg.file_name || 'Файл')}</a>`;
                }
            }

            div.innerHTML = `
                <div class="sender">${escapeHtml(msg.username)}</div>
                ${content}
                <div class="time">${formatTime(msg.created_at)}</div>
            `;

            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function appendPrivateMessage(msg) {
            // Проверяем, нет ли уже такого сообщения
            const exists = document.querySelector(`[data-msg-id="${msg.id}"]`);
            if (exists) return;

            const div = document.createElement('div');
            div.className = `msg ${msg.sender === username ? 'self' : 'other'}`;
            div.setAttribute('data-msg-id', msg.id);

            let content = '';
            if (msg.text) {
                content += escapeHtml(msg.text);
            }
            if (msg.file_url) {
                content += `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 Файл</a>`;
            }

            div.innerHTML = `
                <div class="sender">${msg.sender === username ? 'Вы' : escapeHtml(msg.sender)}</div>
                ${content}
                <div class="time">${formatTime(msg.created_at)}</div>
            `;

            messagesEl.appendChild(div);
            scrollToBottom();
        }

        // ============================================================
        //  ОТПРАВКА СООБЩЕНИЙ
        // ============================================================

        async function sendMessage(text, fileUrl = null, fileName = null) {
            if (!text && !fileUrl) return;
            if (!username) return;

            try {
                if (currentChatType === 'general') {
                    const { data, error } = await sbClient
                        .from('messages')
                        .insert([{
                            username: username,
                            room: currentChat,
                            text: text || null,
                            file_url: fileUrl || null,
                            file_name: fileName || null,
                        }])
                        .select();

                    if (error) throw error;

                    // Добавляем с ID из БД
                    if (data && data.length > 0) {
                        appendMessage(data[0]);
                        lastMsgId = data[0].id;
                    }

                } else {
                    const { data, error } = await sbClient
                        .from('private_messages')
                        .insert([{
                            sender: username,
                            receiver: currentChat,
                            text: text || null,
                            file_url: fileUrl || null,
                            file_name: fileName || null,
                        }])
                        .select();

                    if (error) throw error;

                    if (data && data.length > 0) {
                        appendPrivateMessage(data[0]);
                        lastPrivateMsgId = data[0].id;
                    }

                    setTimeout(loadChats, 500);
                }

                msgInput.value = '';
                msgInput.focus();
                scrollToBottom();

            } catch (err) {
                console.error('Ошибка отправки:', err);
                uploadStatus.textContent = '❌ ' + err.message;
                uploadStatus.style.color = '#ff4d6d';
                setTimeout(() => {
                    uploadStatus.textContent = '';
                }, 3000);
            }
        }

        // ============================================================
        //  ЗАГРУЗКА ФАЙЛОВ
        // ============================================================

        async function uploadFiles(files) {
            if (!files || files.length === 0) return;

            for (const file of files) {
                uploadStatus.textContent = `⏫ Загрузка: ${file.name} ...`;
                uploadStatus.style.color = '#ffd93d';

                try {
                    const path = `chats/${Date.now()}_${file.name}`;
                    const { error: uploadError } = await sbClient.storage
                        .from(BUCKET)
                        .upload(path, file, {
                            contentType: file.type,
                            cacheControl: '3600',
                        });

                    if (uploadError) throw uploadError;

                    const { data: urlData } = sbClient.storage
                        .from(BUCKET)
                        .getPublicUrl(path);

                    await sendMessage('', urlData.publicUrl, file.name);

                    uploadStatus.textContent = `✅ ${file.name} загружен`;
                    uploadStatus.style.color = '#6fcf97';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 2000);

                } catch (err) {
                    console.error('Ошибка загрузки файла:', err);
                    uploadStatus.textContent = `❌ ${file.name}: ${err.message}`;
                    uploadStatus.style.color = '#ff4d6d';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 3000);
                }
            }
        }

        // ============================================================
        //  REALTIME ПОДПИСКИ (улучшенные)
        // ============================================================

        function subscribeToGeneral() {
            if (channel) { 
                try { channel.unsubscribe(); } catch(e) {}
                channel = null; 
            }

            channel = sbClient
                .channel(`messages-${currentChat}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `room=eq.${currentChat}`,
                }, (payload) => {
                    const msg = payload.new;
                    console.log('⚡ Realtime общее сообщение:', msg);
                    // Проверяем, что не от себя и нет дубликата
                    if (msg.username !== username && msg.id > lastMsgId) {
                        appendMessage(msg);
                        lastMsgId = msg.id;
                    }
                })
                .subscribe((status) => {
                    console.log(`📡 Realtime общий статус:`, status);
                    if (status === 'SUBSCRIBED') {
                        isSubscribed = true;
                        console.log(`✅ Подписка на ${currentChat} активна`);
                    } else if (status === 'CHANNEL_ERROR' || status === 'closed') {
                        console.log(`⚠️ Канал закрыт, переподключаемся...`);
                        setTimeout(() => subscribeToGeneral(), 3000);
                    }
                });
        }

        function subscribeToPrivate(target) {
            if (privateChannel) { 
                try { privateChannel.unsubscribe(); } catch(e) {}
                privateChannel = null; 
            }

            privateChannel = sbClient
                .channel(`private-${username}-${target}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'private_messages',
                    filter: `or(and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username}))`,
                }, (payload) => {
                    const msg = payload.new;
                    console.log('⚡ Realtime личное сообщение:', msg);
                    if (msg.sender !== username && msg.id > lastPrivateMsgId) {
                        appendPrivateMessage(msg);
                        lastPrivateMsgId = msg.id;
                        setTimeout(loadChats, 500);
                    }
                })
                .subscribe((status) => {
                    console.log(`📡 Realtime личный статус (${target}):`, status);
                    if (status === 'SUBSCRIBED') {
                        isSubscribed = true;
                        console.log(`✅ Подписка на личку с ${target} активна`);
                    } else if (status === 'CHANNEL_ERROR' || status === 'closed') {
                        console.log(`⚠️ Канал закрыт, переподключаемся...`);
                        setTimeout(() => subscribeToPrivate(target), 3000);
                    }
                });
        }

        // ============================================================
        //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================

        function scrollToBottom() {
            setTimeout(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }, 100);
        }

        function formatTime(date) {
            if (!date) return '';
            const d = new Date(date);
            const now = new Date();
            const diff = (now - d) / 1000 / 60;
            if (diff < 60) return Math.floor(diff) + 'м';
            if (diff < 1440) return Math.floor(diff / 60) + 'ч';
            return d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  СОБЫТИЯ
        // ============================================================

        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (text) {
                sendMessage(text);
            }
        });

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        fileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFiles(e.target.files);
                fileInput.value = '';
            }
        });

        searchInput.addEventListener('input', () => {
            renderChats(searchInput.value.trim());
        });

        mobileBack.addEventListener('click', () => {
            document.getElementById('chatArea').classList.remove('open');
            document.getElementById('sidebar').style.display = 'flex';
        });

        window.addEventListener('resize', () => {
            isMobile = window.innerWidth <= 600;
            if (!isMobile) {
                document.getElementById('chatArea').classList.remove('open');
                document.getElementById('sidebar').style.display = 'flex';
            }
        });

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        const hasSession = checkSession();

        if (!hasSession) {
            loginScreen.style.display = 'flex';
            mainUI.style.display = 'none';
        }

        console.log('💬 Братанский мессенджер PRO (Telegram-стиль)!');
        console.log('🔐 Есть регистрация и вход');
        console.log('👥 Список чатов слева, как в телеграме');
        console.log('💾 Сессия сохраняется');
        console.log('🔄 Polling включен — сообщения будут приходить даже если Realtime не работает!');
    </script>
</body>
</html>
