<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💬 Братанский</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0b0f;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100vh;
            background: #11131e;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ (список чатов) ===== */
        #sidebar {
            width: 320px;
            min-width: 280px;
            background: #0e0f17;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        #sidebar .header {
            padding: 16px 20px 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #sidebar .header h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #sidebar .header .user-info {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }

        #sidebar .search {
            padding: 10px 16px;
        }
        #sidebar .search input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #sidebar .search input:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #sidebar .search input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        #chatList {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        #chatList::-webkit-scrollbar {
            width: 4px;
        }
        #chatList::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 12px;
            border-left: 3px solid transparent;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .chat-item.active {
            background: rgba(0, 212, 255, 0.06);
            border-left-color: #00d4ff;
        }
        .chat-item .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        .chat-item .info .name {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
        }
        .chat-item .info .last-msg {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item .time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }
        .chat-item .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .chat-item .online-dot.online {
            background: #6fcf97;
        }
        .chat-item .online-dot.offline {
            background: rgba(255, 255, 255, 0.1);
        }
        .chat-item .unread-badge {
            background: #00d4ff;
            color: #000;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0 5px;
        }

        /* ===== ПРАВАЯ ПАНЕЛЬ (чат) ===== */
        #chatArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #11131e;
            min-width: 0;
        }

        #chatHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            min-height: 68px;
            gap: 12px;
        }
        #chatHeader .chat-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        #chatHeader .chat-title {
            font-size: 17px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #chatHeader .chat-title small {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
            margin-left: 8px;
        }
        #chatHeader .chat-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        #chatHeader .chat-actions button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #chatHeader .chat-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        #chatHeader .chat-actions button.call-active {
            background: rgba(0, 212, 255, 0.15);
            border-color: #00d4ff;
            color: #00d4ff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 212, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
        }
        #chatHeader .back-btn {
            display: none;
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #messages::-webkit-scrollbar {
            width: 4px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .msg {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.2s;
        }
        .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .msg .sender {
            font-size: 11px;
            color: #00d4ffaa;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .msg .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
            text-align: right;
        }
        .msg img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg .file-link {
            color: #00d4ff;
            text-decoration: underline;
            word-break: break-all;
            display: inline-block;
            margin-top: 2px;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #inputArea {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            align-items: center;
        }
        #inputArea input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 15px;
            outline: none;
            min-height: 44px;
        }
        #inputArea input[type="text"]:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #inputArea .btn-send {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
            min-height: 44px;
            min-width: 44px;
        }
        #inputArea .btn-file {
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #inputArea .btn-file:active,
        #inputArea .btn-send:active {
            transform: scale(0.94);
        }
        #fileInput {
            display: none;
        }
        #uploadStatus {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            padding: 2px 16px;
            text-align: center;
            min-height: 20px;
        }

        /* ===== ЭКРАН ВХОДА ===== */
        #loginScreen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            flex: 1;
            gap: 12px;
            background: radial-gradient(circle at center, #151725, #07080b);
        }
        #loginScreen h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loginScreen input {
            width: 100%;
            max-width: 320px;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #loginScreen input:focus {
            border-color: rgba(0, 212, 255, 0.3);
        }
        #loginScreen button {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }
        #loginScreen .error {
            color: #ff4d6d;
            font-size: 13px;
            min-height: 20px;
        }
        #loginScreen .switch {
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            cursor: pointer;
        }
        #loginScreen .switch:active {
            color: #00d4ff;
        }

        /* ===== ВИДЕОЗВОНОК ===== */
        #callOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #callOverlay.active {
            display: flex;
        }
        #callOverlay .call-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #0b0b0f;
        }
        #callOverlay .remote-video {
            width: 100%;
            background: #0b0b0f;
            border-radius: 20px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #callOverlay .remote-video video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            background: #0b0b0f;
            border-radius: 20px;
        }
        #callOverlay .remote-video .no-video {
            color: rgba(255, 255, 255, 0.2);
            font-size: 48px;
        }
        #callOverlay .local-video {
            position: absolute;
            bottom: 80px;
            right: 16px;
            width: 160px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #0b0b0f;
        }
        #callOverlay .local-video video {
            width: 100%;
            display: block;
        }
        #callOverlay .call-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 24px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        #callOverlay .call-controls button {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #callOverlay .call-controls button:hover {
            transform: scale(1.05);
        }
        #callOverlay .call-controls .btn-end-call {
            background: #ff4d6d;
            color: #fff;
        }
        #callOverlay .call-controls .btn-end-call:hover {
            background: #ff1744;
        }
        #callOverlay .call-controls .btn-toggle-mic {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        #callOverlay .call-controls .btn-toggle-mic.muted {
            background: #ff4d6d44;
            color: #ff4d6d;
        }
        #callOverlay .call-controls .btn-toggle-video {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        #callOverlay .call-controls .btn-toggle-video.video-off {
            background: #ff4d6d44;
            color: #ff4d6d;
        }
        #callOverlay .call-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        #callOverlay .call-info .call-status {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
        }
        @media (max-width: 600px) {
            #callOverlay .local-video {
                width: 100px;
                bottom: 70px;
                right: 10px;
            }
            #callOverlay .call-controls {
                padding: 8px 16px;
                gap: 10px;
            }
            #callOverlay .call-controls button {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            #callOverlay .remote-video {
                min-height: 300px;
            }
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            #sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 10;
                transform: translateX(0);
            }
            #sidebar.hidden {
                transform: translateX(-100%);
            }
            #chatArea {
                width: 100%;
            }
            #chatHeader .back-btn {
                display: block;
            }
            .msg {
                max-width: 85%;
            }
        }

        @media (min-width: 769px) {
            #sidebar {
                position: relative !important;
                transform: none !important;
            }
            #sidebar.hidden {
                transform: none !important;
            }
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.05);
            padding: 30px 0;
            font-size: 13px;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 50, 50, 0.1);
            background: rgba(255, 50, 50, 0.05);
            color: #ff4d6d;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background: rgba(255, 50, 50, 0.1);
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- ===== ЭКРАН ВХОДА ===== -->
        <div id="loginScreen">
            <h1>💬 Братанский</h1>
            <p style="color:rgba(255,255,255,0.2);font-size:13px;" id="loginTitle">Вход в аккаунт</p>
            <input id="loginUsername" type="text" placeholder="Имя пользователя" />
            <input id="loginPassword" type="password" placeholder="Пароль" />
            <div class="error" id="loginError"></div>
            <button id="loginBtn">ВОЙТИ</button>
            <span class="switch" id="switchAuth">Нет аккаунта? Зарегистрироваться</span>
        </div>

        <!-- ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== -->
        <div id="mainUI" style="display:none;width:100%;height:100%;position:relative;">

            <!-- ЛЕВАЯ ПАНЕЛЬ -->
            <div id="sidebar">
                <div class="header">
                    <h2>💬 Братанский</h2>
                    <div class="user-info" id="sidebarUser">—</div>
                </div>
                <div class="search">
                    <input id="searchInput" type="text" placeholder="🔍 Поиск..." />
                </div>
                <div id="chatList">
                    <div class="empty-state">Загрузка...</div>
                </div>
                <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.04);">
                    <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
                </div>
            </div>

            <!-- ПРАВАЯ ПАНЕЛЬ (чат) -->
            <div id="chatArea">
                <div id="chatHeader">
                    <div class="chat-left">
                        <button class="back-btn" id="mobileBack">←</button>
                        <span class="chat-title" id="chatTitle">Выберите чат</span>
                    </div>
                    <div class="chat-actions">
                        <button id="callBtn" title="Звонок" style="display:none;">📞</button>
                        <button id="videoCallBtn" title="Видеозвонок" style="display:none;">📹</button>
                    </div>
                </div>
                <div id="messages">
                    <div class="empty-state">👈 Выберите чат слева</div>
                </div>
                <div id="uploadStatus"></div>
                <div id="inputArea">
                    <button class="btn-file" id="fileBtn">📎</button>
                    <input id="fileInput" type="file" multiple />
                    <input id="msgInput" type="text" placeholder="Напиши что-то..." disabled />
                    <button class="btn-send" id="sendBtn" disabled>→</button>
                </div>
            </div>

        </div>

    </div>

    <!-- ===== ОВЕРЛЕЙ ЗВОНКА ===== -->
    <div id="callOverlay">
        <div class="call-container">
            <div class="call-info">
                <div id="callPartnerName">Собеседник</div>
                <div class="call-status" id="callStatus">Подключение...</div>
            </div>
            <div class="remote-video">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="no-video" id="noRemoteVideo">📹</div>
            </div>
            <div class="local-video">
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="call-controls">
                <button class="btn-toggle-mic" id="toggleMicBtn" title="Микрофон">🎤</button>
                <button class="btn-toggle-video" id="toggleVideoBtn" title="Видео">📹</button>
                <button class="btn-end-call" id="endCallBtn">📞</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ⚡ ТВОИ ДАННЫЕ SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://uxjoowanhrmbrnqtghyc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3Dzhz17WLtHl1jguQlGNTQ_gu2REAg6';
        const BUCKET = 'chat-files';
        // ============================================================

        // ===== СОЗДАЕМ КЛИЕНТ =====
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            realtime: {
                params: {
                    eventsPerSecond: 10,
                    heartbeatIntervalMs: 5000,
                },
                reconnectAfterMs: function(attempts) {
                    return Math.min(1000 * Math.pow(2, attempts), 30000);
                }
            }
        });

        // ---------- ЭЛЕМЕНТЫ ----------
        const loginScreen = document.getElementById('loginScreen');
        const mainUI = document.getElementById('mainUI');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const switchAuth = document.getElementById('switchAuth');
        const loginTitle = document.getElementById('loginTitle');
        const logoutBtn = document.getElementById('logoutBtn');
        const sidebarUser = document.getElementById('sidebarUser');
        const chatList = document.getElementById('chatList');
        const chatTitle = document.getElementById('chatTitle');
        const messagesEl = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const searchInput = document.getElementById('searchInput');
        const mobileBack = document.getElementById('mobileBack');
        const callBtn = document.getElementById('callBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');
        const sidebar = document.getElementById('sidebar');
        const chatArea = document.getElementById('chatArea');

        // ---------- СОСТОЯНИЕ ----------
        let username = '';
        let userId = null;
        let currentChat = null;
        let currentChatType = 'general';
        let channel = null;
        let privateChannel = null;
        let isLoginMode = true;
        let allUsers = [];
        let chats = [];
        let pollingInterval = null;
        let lastMsgId = 0;
        let lastPrivateMsgId = 0;
        let unreadCounts = {};
        let isPageFocused = true;

        // ===== ЗВУК УВЕДОМЛЕНИЯ (генерируем через Web Audio) =====
        function playNotificationSound() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                
                // Первый звук (высокий)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.15);

                // Второй звук (чуть ниже) через паузу
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(1000, audioCtx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
                    gain2.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(audioCtx.currentTime);
                    osc2.stop(audioCtx.currentTime + 0.15);
                }, 120);
            } catch (e) {
                // Если Web Audio не работает, пробуем через <audio>
                try {
                    const audio = new Audio('data:audio/wav;base64,U3R1ZmZUdXJlIQ==');
                    audio.volume = 0.5;
                    audio.play().catch(() => {});
                } catch(e2) {}
            }
        }

        // ===== ОТСЛЕЖИВАНИЕ ФОКУСА СТРАНИЦЫ =====
        document.addEventListener('visibilitychange', () => {
            isPageFocused = !document.hidden;
            if (isPageFocused) {
                document.title = '💬 Братанский';
            }
        });

        window.addEventListener('focus', () => {
            isPageFocused = true;
            document.title = '💬 Братанский';
        });

        window.addEventListener('blur', () => {
            isPageFocused = false;
        });

        // ============================================================
        //  АВТОРИЗАЦИЯ
        // ============================================================

        function checkSession() {
            try {
                const saved = localStorage.getItem('boss_chat_session');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.username && data.userId) {
                        username = data.username;
                        userId = data.userId;
                        loginScreen.style.display = 'none';
                        mainUI.style.display = 'flex';
                        sidebarUser.textContent = username;
                        loadChats();
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        function saveSession() {
            try {
                localStorage.setItem('boss_chat_session', JSON.stringify({
                    username: username,
                    userId: userId
                }));
            } catch (e) {}
        }

        function clearSession() {
            localStorage.removeItem('boss_chat_session');
        }

        async function register() {
            const name = loginUsername.value.trim();
            const pass = loginPassword.value.trim();

            if (!name || name.length < 2) {
                loginError.textContent = '❌ Имя минимум 2 символа';
                return;
            }
            if (!pass || pass.length < 4) {
                loginError.textContent = '❌ Пароль минимум 4 символа';
                return;
            }

            try {
                const { data: existing } = await sbClient
                    .from('users')
                    .select('id')
                    .eq('username', name);

                if (existing && existing.length > 0) {
                    loginError.textContent = '❌ Пользователь уже существует';
                    return;
                }

                const { data, error } = await sbClient
                    .from('users')
                    .insert([{
                        username: name,
                        password: pass,
                        last_seen: new Date().toISOString(),
                    }])
                    .select();

                if (error) throw error;

                username = name;
                userId = data[0].id;
                saveSession();
                loginScreen.style.display = 'none';
                mainUI.style.display = 'flex';
                sidebarUser.textContent = username;
                loadChats();
                loginError.textContent = '';

            } catch (err) {
                loginError.textContent = '❌ ' + err.message;
            }
        }

        async function login() {
            const name = loginUsername.value.trim();
            const pass = loginPassword.value.trim();

            if (!name || !pass) {
                loginError.textContent = '❌ Заполни все поля';
                return;
            }

            try {
                const { data, error } = await sbClient
                    .from('users')
                    .select('*')
                    .eq('username', name)
                    .eq('password', pass);

                if (error) throw error;

                if (!data || data.length === 0) {
                    loginError.textContent = '❌ Неверный логин или пароль';
                    return;
                }

                username = name;
                userId = data[0].id;

                await sbClient
                    .from('users')
                    .update({ last_seen: new Date().toISOString() })
                    .eq('id', userId);

                saveSession();
                loginScreen.style.display = 'none';
                mainUI.style.display = 'flex';
                sidebarUser.textContent = username;
                loadChats();
                loginError.textContent = '';

            } catch (err) {
                loginError.textContent = '❌ ' + err.message;
            }
        }

        logoutBtn.addEventListener('click', () => {
            if (channel) { channel.unsubscribe();
                channel = null; }
            if (privateChannel) { privateChannel.unsubscribe();
                privateChannel = null; }
            if (pollingInterval) { clearInterval(pollingInterval);
                pollingInterval = null; }
            clearSession();
            username = '';
            userId = null;
            mainUI.style.display = 'none';
            loginScreen.style.display = 'flex';
            messagesEl.innerHTML = '';
            loginUsername.value = '';
            loginPassword.value = '';
            loginError.textContent = '';
            currentChat = null;
            currentChatType = 'general';
            chatTitle.textContent = 'Выберите чат';
            msgInput.disabled = true;
            sendBtn.disabled = true;
            callBtn.style.display = 'none';
            videoCallBtn.style.display = 'none';
        });

        switchAuth.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            loginTitle.textContent = isLoginMode ? 'Вход в аккаунт' : 'Регистрация нового аккаунта';
            loginBtn.textContent = isLoginMode ? 'ВОЙТИ' : 'ЗАРЕГИСТРИРОВАТЬСЯ';
            switchAuth.textContent = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
            loginError.textContent = '';
        });

        loginBtn.addEventListener('click', () => {
            if (isLoginMode) login();
            else register();
        });

        loginUsername.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginPassword.focus();
        });
        loginPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // ============================================================
        //  ЗАГРУЗКА ЧАТОВ
        // ============================================================

        async function loadChats() {
            try {
                const { data: users, error: userError } = await sbClient
                    .from('users')
                    .select('username, last_seen')
                    .neq('username', username)
                    .order('username');

                if (userError) throw userError;

                allUsers = users || [];

                const chatListData = [];
                for (const u of allUsers) {
                    const { data: msgs } = await sbClient
                        .from('private_messages')
                        .select('text, created_at, sender, id')
                        .or(`and(sender.eq.${username},receiver.eq.${u.username}),and(sender.eq.${u.username},receiver.eq.${username})`)
                        .order('created_at', { ascending: false })
                        .limit(1);

                    if (msgs && msgs.length > 0) {
                        const last = msgs[0];
                        chatListData.push({
                            id: u.username,
                            name: u.username,
                            type: 'private',
                            lastMsg: last.sender === username ? 'Вы: ' + (last.text || 'Файл') : last.text || 'Файл',
                            time: last.created_at,
                            online: Date.now() - new Date(u.last_seen).getTime() < 60000
                        });
                    } else {
                        chatListData.push({
                            id: u.username,
                            name: u.username,
                            type: 'private',
                            lastMsg: 'Нет сообщений',
                            time: null,
                            online: Date.now() - new Date(u.last_seen).getTime() < 60000
                        });
                    }
                }

                chatListData.sort((a, b) => {
                    if (!a.time) return 1;
                    if (!b.time) return -1;
                    return new Date(b.time) - new Date(a.time);
                });

                chats = chatListData;
                renderChats();

            } catch (err) {
                console.error('Ошибка загрузки чатов:', err);
                chatList.innerHTML = `<div class="empty-state">❌ ${err.message}</div>`;
            }
        }

        function renderChats(filter = '') {
            chatList.innerHTML = '';

            const generalChat = {
                id: 'general',
                name: '# Общий',
                type: 'general',
                lastMsg: 'Общий чат',
                time: null,
                online: true
            };

            let items = [generalChat, ...chats];

            if (filter) {
                const f = filter.toLowerCase();
                items = items.filter(c => c.name.toLowerCase().includes(f));
            }

            if (items.length === 0) {
                chatList.innerHTML = '<div class="empty-state">👀 Ничего не найдено</div>';
                return;
            }

            items.forEach(chat => {
                const div = document.createElement('div');
                const isActive = currentChat === chat.id && currentChatType === chat.type;
                div.className = `chat-item ${isActive ? 'active' : ''}`;
                const isOnline = chat.online !== undefined ? chat.online : true;
                const unread = unreadCounts[chat.id + '_' + chat.type] || 0;

                div.innerHTML = `
                    <div class="avatar">${chat.type === 'general' ? '💬' : '👤'}</div>
                    <div class="info">
                        <div class="name">${chat.name}</div>
                        <div class="last-msg">${chat.lastMsg || ''}</div>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                        ${chat.time ? `<span class="time">${formatTime(chat.time)}</span>` : ''}
                        <div style="display:flex;align-items:center;gap:6px;">
                            ${chat.type === 'private' ? `<span class="online-dot ${isOnline ? 'online' : 'offline'}"></span>` : ''}
                            ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ''}
                        </div>
                    </div>
                `;

                div.addEventListener('click', () => {
                    // Сбрасываем счетчик непрочитанных
                    unreadCounts[chat.id + '_' + chat.type] = 0;
                    openChat(chat.id, chat.type, chat.name);
                });

                chatList.appendChild(div);
            });
        }

        // ============================================================
        //  ОТКРЫТИЕ ЧАТА
        // ============================================================

        function openChat(id, type, name) {
            if (channel) { channel.unsubscribe();
                channel = null; }
            if (privateChannel) { privateChannel.unsubscribe();
                privateChannel = null; }
            if (pollingInterval) { clearInterval(pollingInterval);
                pollingInterval = null; }

            currentChat = id;
            currentChatType = type;
            chatTitle.textContent = name;

            msgInput.disabled = false;
            sendBtn.disabled = false;
            msgInput.focus();

            // Показываем кнопки звонка только для личных чатов
            if (type === 'private') {
                callBtn.style.display = 'flex';
                videoCallBtn.style.display = 'flex';
            } else {
                callBtn.style.display = 'none';
                videoCallBtn.style.display = 'none';
            }

            // Мобилка: прячем сайдбар
            if (window.innerWidth <= 768) {
                sidebar.classList.add('hidden');
            }

            if (type === 'general') {
                loadMessages('general');
                subscribeToGeneral();
                startPolling('general');
            } else {
                loadPrivateMessages(id);
                subscribeToPrivate(id);
                startPrivatePolling(id);
            }

            renderChats(searchInput.value.trim());
        }

        // ============================================================
        //  ПОЛЛИНГ С УВЕДОМЛЕНИЯМИ
        // ============================================================

        function startPolling(room) {
            loadLastMessageId(room);
            if (pollingInterval) clearInterval(pollingInterval);

            pollingInterval = setInterval(async () => {
                try {
                    const { data, error } = await sbClient
                        .from('messages')
                        .select('*')
                        .eq('room', room)
                        .gt('id', lastMsgId)
                        .order('created_at', { ascending: true });

                    if (error) throw error;

                    if (data && data.length > 0) {
                        console.log(`📩 Polling: ${data.length} новых сообщений`);
                        data.forEach(msg => {
                            if (msg.id > lastMsgId) {
                                const isOwn = msg.username === username;
                                // Если сообщение не от себя и чат не активен или страница не в фокусе
                                if (!isOwn) {
                                    const isCurrentChat = currentChat === room && currentChatType === 'general';
                                    if (!isCurrentChat || !isPageFocused) {
                                        playNotificationSound();
                                        // Обновляем счетчик непрочитанных
                                        const key = room + '_general';
                                        unreadCounts[key] = (unreadCounts[key] || 0) + 1;
                                        // Меняем заголовок
                                        if (!isPageFocused) {
                                            document.title = `💬 Новое сообщение от ${msg.username}`;
                                        }
                                    }
                                    appendMessage(msg);
                                }
                                lastMsgId = msg.id;
                            }
                        });
                        renderChats(searchInput.value.trim());
                    }
                } catch (err) {
                    // Игнорируем ошибки
                }
            }, 2000);
        }

        function startPrivatePolling(target) {
            if (pollingInterval) clearInterval(pollingInterval);

            pollingInterval = setInterval(async () => {
                try {
                    const { data, error } = await sbClient
                        .from('private_messages')
                        .select('*')
                        .or(`and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username})`)
                        .gt('id', lastPrivateMsgId)
                        .order('created_at', { ascending: true });

                    if (error) throw error;

                    if (data && data.length > 0) {
                        console.log(`📩 Private Polling: ${data.length} новых сообщений`);
                        data.forEach(msg => {
                            if (msg.id > lastPrivateMsgId) {
                                const isOwn = msg.sender === username;
                                if (!isOwn) {
                                    const isCurrentChat = currentChat === target && currentChatType === 'private';
                                    if (!isCurrentChat || !isPageFocused) {
                                        playNotificationSound();
                                        const key = target + '_private';
                                        unreadCounts[key] = (unreadCounts[key] || 0) + 1;
                                        if (!isPageFocused) {
                                            document.title = `💬 Новое сообщение от ${msg.sender}`;
                                        }
                                    }
                                    appendPrivateMessage(msg);
                                }
                                lastPrivateMsgId = msg.id;
                            }
                        });
                        renderChats(searchInput.value.trim());
                    }
                } catch (err) {
                    // Игнорируем ошибки
                }
            }, 2000);
        }

        // ============================================================
        //  ЗАГРУЗКА СООБЩЕНИЙ
        // ============================================================

        async function loadLastMessageId(room) {
            try {
                const { data } = await sbClient
                    .from('messages')
                    .select('id')
                    .eq('room', room)
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (data && data.length > 0) {
                    lastMsgId = data[0].id;
                } else {
                    lastMsgId = 0;
                }
            } catch (e) {
                lastMsgId = 0;
            }
        }

        async function loadMessages(room) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('messages')
                    .select('*')
                    .eq('room', room)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                if (data && data.length > 0) {
                    lastMsgId = data[data.length - 1].id;
                }

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Сообщений пока нет. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        async function loadPrivateMessages(target) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('private_messages')
                    .select('*')
                    .or(`and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username})`)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                if (data && data.length > 0) {
                    lastPrivateMsgId = data[data.length - 1].id;
                }

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Нет сообщений. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendPrivateMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки личных сообщений:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        // ============================================================
        //  ОТРИСОВКА СООБЩЕНИЙ
        // ============================================================

        function appendMessage(msg) {
            const exists = document.querySelector(`[data-msg-id="${msg.id}"]`);
            if (exists) return;

            const div = document.createElement('div');
            div.className = `msg ${msg.username === username ? 'self' : 'other'}`;
            div.setAttribute('data-msg-id', msg.id);

            let content = '';
            if (msg.text) {
                content += escapeHtml(msg.text);
            }
            if (msg.file_url) {
                const ext = msg.file_url.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
                const isVideo = ['mp4', 'mov', 'avi', 'webm'].includes(ext);

                if (isImage) {
                    content += `<br><img src="${msg.file_url}" style="max-width:100%;border-radius:10px;margin-top:4px;" />`;
                } else if (isVideo) {
                    content +=
                        `<br><video src="${msg.file_url}" controls style="max-width:100%;border-radius:10px;margin-top:4px;"></video>`;
                } else {
                    content += `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 ${escapeHtml(msg.file_name || 'Файл')}</a>`;
                }
            }

            div.innerHTML = `
                <div class="sender">${escapeHtml(msg.username)}</div>
                ${content}
                <div class="time">${formatTime(msg.created_at)}</div>
            `;

            messagesEl.appendChild(div);
            scrollToBottom();
        }

        function appendPrivateMessage(msg) {
            const exists = document.querySelector(`[data-msg-id="${msg.id}"]`);
            if (exists) return;

            const div = document.createElement('div');
            div.className = `msg ${msg.sender === username ? 'self' : 'other'}`;
            div.setAttribute('data-msg-id', msg.id);

            let content = '';
            if (msg.text) {
                content += escapeHtml(msg.text);
            }
            if (msg.file_url) {
                content += `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 Файл</a>`;
            }

            div.innerHTML = `
                <div class="sender">${msg.sender === username ? 'Вы' : escapeHtml(msg.sender)}</div>
                ${content}
                <div class="time">${formatTime(msg.created_at)}</div>
            `;

            messagesEl.appendChild(div);
            scrollToBottom();
        }

        // ============================================================
        //  ОТПРАВКА СООБЩЕНИЙ
        // ============================================================

        async function sendMessage(text, fileUrl = null, fileName = null) {
            if (!text && !fileUrl) return;
            if (!username) return;

            try {
                if (currentChatType === 'general') {
                    const { data, error } = await sbClient
                        .from('messages')
                        .insert([{
                            username: username,
                            room: currentChat,
                            text: text || null,
                            file_url: fileUrl || null,
                            file_name: fileName || null,
                        }])
                        .select();

                    if (error) throw error;

                    if (data && data.length > 0) {
                        appendMessage(data[0]);
                        lastMsgId = data[0].id;
                    }

                } else {
                    const { data, error } = await sbClient
                        .from('private_messages')
                        .insert([{
                            sender: username,
                            receiver: currentChat,
                            text: text || null,
                            file_url: fileUrl || null,
                            file_name: fileName || null,
                        }])
                        .select();

                    if (error) throw error;

                    if (data && data.length > 0) {
                        appendPrivateMessage(data[0]);
                        lastPrivateMsgId = data[0].id;
                    }

                    setTimeout(loadChats, 500);
                }

                msgInput.value = '';
                msgInput.focus();
                scrollToBottom();

            } catch (err) {
                console.error('Ошибка отправки:', err);
                uploadStatus.textContent = '❌ ' + err.message;
                uploadStatus.style.color = '#ff4d6d';
                setTimeout(() => {
                    uploadStatus.textContent = '';
                }, 3000);
            }
        }

        // ============================================================
        //  ЗАГРУЗКА ФАЙЛОВ
        // ============================================================

        async function uploadFiles(files) {
            if (!files || files.length === 0) return;

            for (const file of files) {
                uploadStatus.textContent = `⏫ Загрузка: ${file.name} ...`;
                uploadStatus.style.color = '#ffd93d';

                try {
                    const path = `chats/${Date.now()}_${file.name}`;
                    const { error: uploadError } = await sbClient.storage
                        .from(BUCKET)
                        .upload(path, file, {
                            contentType: file.type,
                            cacheControl: '3600',
                        });

                    if (uploadError) throw uploadError;

                    const { data: urlData } = sbClient.storage
                        .from(BUCKET)
                        .getPublicUrl(path);

                    await sendMessage('', urlData.publicUrl, file.name);

                    uploadStatus.textContent = `✅ ${file.name} загружен`;
                    uploadStatus.style.color = '#6fcf97';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 2000);

                } catch (err) {
                    console.error('Ошибка загрузки файла:', err);
                    uploadStatus.textContent = `❌ ${file.name}: ${err.message}`;
                    uploadStatus.style.color = '#ff4d6d';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 3000);
                }
            }
        }

        // ============================================================
        //  REALTIME ПОДПИСКИ
        // ============================================================

        function subscribeToGeneral() {
            if (channel) {
                try { channel.unsubscribe(); } catch (e) {}
                channel = null;
            }

            channel = sbClient
                .channel(`messages-${currentChat}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `room=eq.${currentChat}`,
                }, (payload) => {
                    const msg = payload.new;
                    console.log('⚡ Realtime общее сообщение:', msg);
                    if (msg.username !== username && msg.id > lastMsgId) {
                        // Звук, если не в этом чате
                        const isCurrentChat = currentChat === 'general' && currentChatType === 'general';
                        if (!isCurrentChat || !isPageFocused) {
                            playNotificationSound();
                            const key = 'general_general';
                            unreadCounts[key] = (unreadCounts[key] || 0) + 1;
                            if (!isPageFocused) {
                                document.title = `💬 Новое сообщение от ${msg.username}`;
                            }
                        }
                        appendMessage(msg);
                        lastMsgId = msg.id;
                        renderChats(searchInput.value.trim());
                    }
                })
                .subscribe((status) => {
                    console.log(`📡 Realtime общий статус:`, status);
                    if (status === 'SUBSCRIBED') {
                        console.log(`✅ Подписка на ${currentChat} активна`);
                    } else if (status === 'CHANNEL_ERROR' || status === 'closed') {
                        setTimeout(() => subscribeToGeneral(), 3000);
                    }
                });
        }

        function subscribeToPrivate(target) {
            if (privateChannel) {
                try { privateChannel.unsubscribe(); } catch (e) {}
                privateChannel = null;
            }

            privateChannel = sbClient
                .channel(`private-${username}-${target}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'private_messages',
                    filter: `or(and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username}))`,
                }, (payload) => {
                    const msg = payload.new;
                    console.log('⚡ Realtime личное сообщение:', msg);
                    if (msg.sender !== username && msg.id > lastPrivateMsgId) {
                        const isCurrentChat = currentChat === target && currentChatType === 'private';
                        if (!isCurrentChat || !isPageFocused) {
                            playNotificationSound();
                            const key = target + '_private';
                            unreadCounts[key] = (unreadCounts[key] || 0) + 1;
                            if (!isPageFocused) {
                                document.title = `💬 Новое сообщение от ${msg.sender}`;
                            }
                        }
                        appendPrivateMessage(msg);
                        lastPrivateMsgId = msg.id;
                        setTimeout(loadChats, 500);
                        renderChats(searchInput.value.trim());
                    }
                })
                .subscribe((status) => {
                    console.log(`📡 Realtime личный статус (${target}):`, status);
                    if (status === 'SUBSCRIBED') {
                        console.log(`✅ Подписка на личку с ${target} активна`);
                    } else if (status === 'CHANNEL_ERROR' || status === 'closed') {
                        setTimeout(() => subscribeToPrivate(target), 3000);
                    }
                });
        }

        // ============================================================
        //  АУДИО/ВИДЕО ЗВОНКИ (WebRTC)
        // ============================================================

        let peerConnection = null;
        let localStream = null;
        let callType = 'audio'; // 'audio' или 'video'
        let isCallActive = false;
        let isMuted = false;
        let isVideoOff = false;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
            ]
        };

        async function startCall(type) {
            if (isCallActive) return;
            if (!currentChat || currentChatType !== 'private') {
                uploadStatus.textContent = '❌ Звонки доступны только в личных чатах';
                uploadStatus.style.color = '#ff4d6d';
                setTimeout(() => { uploadStatus.textContent = ''; }, 3000);
                return;
            }

            callType = type;
            isCallActive = true;

            try {
                const constraints = {
                    audio: true,
                    video: type === 'video'
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(configuration);

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                    document.getElementById('noRemoteVideo').style.display = 'none';
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        // Отправляем кандидат через Supabase
                        sendSignalingData({
                            type: 'candidate',
                            candidate: event.candidate,
                            target: currentChat,
                            sender: username
                        });
                    }
                };

                peerConnection.onconnectionstatechange = () => {
                    const status = document.getElementById('callStatus');
                    switch (peerConnection.connectionState) {
                        case 'connecting':
                            status.textContent = 'Подключение...';
                            break;
                        case 'connected':
                            status.textContent = 'Соединено';
                            break;
                        case 'disconnected':
                            status.textContent = 'Разъединено';
                            break;
                        case 'failed':
                            status.textContent = 'Ошибка соединения';
                            break;
                        case 'closed':
                            status.textContent = 'Закрыто';
                            break;
                    }
                };

                // Создаем оффер
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // Отправляем оффер собеседнику
                await sendSignalingData({
                    type: 'offer',
                    offer: offer,
                    target: currentChat,
                    sender: username,
                    callType: type
                });

                document.getElementById('callOverlay').classList.add('active');
                document.getElementById('callPartnerName').textContent = currentChat;
                document.getElementById('callStatus').textContent = 'Ожидание ответа...';

                // Обновляем кнопки в чате
                updateCallButtons(true);

            } catch (err) {
                console.error('Ошибка звонка:', err);
                uploadStatus.textContent = '❌ ' + err.message;
                uploadStatus.style.color = '#ff4d6d';
                setTimeout(() => { uploadStatus.textContent = ''; }, 3000);
                endCall();
            }
        }

        async function handleIncomingCall(data) {
            if (isCallActive) {
                // Отвечаем занято
                await sendSignalingData({
                    type: 'busy',
                    target: data.sender,
                    sender: username
                });
                return;
            }

            callType = data.callType || 'audio';
            isCallActive = true;

            try {
                const constraints = {
                    audio: true,
                    video: callType === 'video'
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(configuration);

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                    document.getElementById('noRemoteVideo').style.display = 'none';
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        sendSignalingData({
                            type: 'candidate',
                            candidate: event.candidate,
                            target: data.sender,
                            sender: username
                        });
                    }
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await sendSignalingData({
                    type: 'answer',
                    answer: answer,
                    target: data.sender,
                    sender: username
                });

                document.getElementById('callOverlay').classList.add('active');
                document.getElementById('callPartnerName').textContent = data.sender;
                document.getElementById('callStatus').textContent = 'Соединение...';

            } catch (err) {
                console.error('Ошибка ответа на звонок:', err);
                endCall();
            }
        }

        function endCall() {
            isCallActive = false;

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('noRemoteVideo').style.display = 'flex';
            document.getElementById('callOverlay').classList.remove('active');

            updateCallButtons(false);
        }

        function updateCallButtons(active) {
            if (active) {
                callBtn.classList.add('call-active');
                videoCallBtn.classList.add('call-active');
            } else {
                callBtn.classList.remove('call-active');
                videoCallBtn.classList.remove('call-active');
            }
        }

        // ===== ОТПРАВКА СИГНАЛЬНЫХ ДАННЫХ ЧЕРЕЗ SUPABASE =====
        async function sendSignalingData(data) {
            try {
                await sbClient
                    .from('signaling')
                    .insert([{
                        sender: data.sender,
                        receiver: data.target,
                        type: data.type,
                        data: JSON.stringify(data)
                    }]);
            } catch (err) {
                console.error('Ошибка отправки сигнальных данных:', err);
            }
        }

        // ===== ПОДПИСКА НА СИГНАЛЬНЫЕ СООБЩЕНИЯ =====
        let signalingChannel = null;

        function subscribeToSignaling() {
            if (signalingChannel) {
                signalingChannel.unsubscribe();
                signalingChannel = null;
            }

            signalingChannel = sbClient
                .channel(`signaling-${username}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'signaling',
                    filter: `receiver=eq.${username}`
                }, async (payload) => {
                    const data = JSON.parse(payload.new.data);
                    console.log('📡 Сигнальное сообщение:', data);

                    if (!isCallActive && data.type === 'offer') {
                        handleIncomingCall(data);
                    } else if (isCallActive && peerConnection) {
                        if (data.type === 'answer') {
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                            document.getElementById('callStatus').textContent = 'Соединено';
                        } else if (data.type === 'candidate') {
                            try {
                                await peerConnection.addIceCandidate(data.candidate);
                            } catch (e) {}
                        } else if (data.type === 'busy') {
                            document.getElementById('callStatus').textContent = 'Собеседник занят';
                            setTimeout(endCall, 2000);
                        } else if (data.type === 'end') {
                            document.getElementById('callStatus').textContent = 'Собеседник завершил звонок';
                            setTimeout(endCall, 1000);
                        }
                    }
                })
                .subscribe((status) => {
                    console.log('📡 Signaling статус:', status);
                });
        }

        // ============================================================
        //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================

        function scrollToBottom() {
            setTimeout(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }, 100);
        }

        function formatTime(date) {
            if (!date) return '';
            const d = new Date(date);
            const now = new Date();
            const diff = (now - d) / 1000 / 60;
            if (diff < 1) return 'только что';
            if (diff < 60) return Math.floor(diff) + 'м';
            if (diff < 1440) return Math.floor(diff / 60) + 'ч';
            return d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  СОБЫТИЯ
        // ============================================================

        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (text) {
                sendMessage(text);
            }
        });

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        fileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFiles(e.target.files);
                fileInput.value = '';
            }
        });

        searchInput.addEventListener('input', () => {
            renderChats(searchInput.value.trim());
        });

        mobileBack.addEventListener('click', () => {
            sidebar.classList.remove('hidden');
        });

        // Кнопки звонков
        callBtn.addEventListener('click', () => startCall('audio'));
        videoCallBtn.addEventListener('click', () => startCall('video'));

        // Кнопки управления звонком
        document.getElementById('endCallBtn').addEventListener('click', () => {
            if (isCallActive && peerConnection) {
                sendSignalingData({
                    type: 'end',
                    target: currentChat,
                    sender: username
                });
            }
            endCall();
        });

        document.getElementById('toggleMicBtn').addEventListener('click', () => {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
            document.getElementById('toggleMicBtn').classList.toggle('muted');
            document.getElementById('toggleMicBtn').textContent = isMuted ? '🔇' : '🎤';
        });

        document.getElementById('toggleVideoBtn').addEventListener('click', () => {
            if (!localStream) return;
            isVideoOff = !isVideoOff;
            localStream.getVideoTracks().forEach(track => track.enabled = !isVideoOff);
            document.getElementById('toggleVideoBtn').classList.toggle('video-off');
            document.getElementById('toggleVideoBtn').textContent = isVideoOff ? '🚫' : '📹';
        });

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        const hasSession = checkSession();

        if (!hasSession) {
            loginScreen.style.display = 'flex';
            mainUI.style.display = 'none';
        } else {
            // Подписываемся на сигнальные сообщения
            subscribeToSignaling();
        }

        console.log('💬 Братанский мессенджер PRO');
        console.log('🔐 Есть регистрация и вход');
        console.log('🔔 Звук уведомлений при новых сообщениях');
        console.log('📞 Аудио и видео звонки через WebRTC');
        console.log('📱 Адаптив под телефон и компьютер');
    </script>
