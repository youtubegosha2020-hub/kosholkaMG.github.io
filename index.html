<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💬 Братанский мессенджер</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0b0f;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #11131e;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        @media (min-width:600px) {
            #app {
                border-radius: 24px;
                height: 90vh;
            }
        }

        /* ===== ЭКРАН ВХОДА ===== */
        #loginScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            flex: 1;
            gap: 12px;
        }
        #loginScreen h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loginScreen input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #loginScreen input:focus {
            border-color: rgba(0, 212, 255, 0.3);
        }
        #loginScreen button {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        #loginScreen .error {
            color: #ff4d6d;
            font-size: 13px;
            min-height: 20px;
        }
        #loginScreen .switch {
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            cursor: pointer;
        }
        #loginScreen .switch:active {
            color: #00d4ff;
        }

        /* ===== ШАПКА ===== */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }
        #header .user {
            font-size: 14px;
            font-weight: 600;
            color: #00d4ff;
        }
        #header .online {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
        #header button {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.1);
            border-radius: 20px;
            padding: 4px 14px;
            color: #ff4d6d;
            font-size: 11px;
            cursor: pointer;
        }

        /* ===== ВКЛАДКИ ===== */
        #tabs {
            display: flex;
            gap: 0;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        #tabs .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.2);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        #tabs .tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }
        #tabs .tab:active {
            transform: scale(0.96);
        }

        /* ===== ПОИСК ===== */
        #searchArea {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
            display: none;
        }
        #searchArea input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #searchArea input:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #searchResult {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            padding: 4px 0;
            text-align: center;
            min-height: 24px;
        }

        /* ===== КОМНАТЫ (для общего чата) ===== */
        #rooms {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            overflow-x: auto;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        #rooms::-webkit-scrollbar {
            height: 2px;
        }
        #rooms::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .room-tab {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            transition: all 0.2s;
        }
        .room-tab.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .room-tab:active {
            transform: scale(0.94);
        }

        /* ===== СООБЩЕНИЯ ===== */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #messages::-webkit-scrollbar {
            width: 3px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.2s;
        }
        .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #00d4ff22, #7b2ffc22);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .msg .sender {
            font-size: 10px;
            color: #00d4ffaa;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .msg .time {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 2px;
            text-align: right;
        }
        .msg img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 4px;
        }
        .msg .file-link {
            color: #00d4ff;
            text-decoration: underline;
            word-break: break-all;
            display: inline-block;
            margin-top: 2px;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== ВВОД ===== */
        #inputArea {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
        }
        #inputArea input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        #inputArea input[type="text"]:focus {
            border-color: rgba(0, 212, 255, 0.2);
        }
        #inputArea .btn-send {
            padding: 10px 18px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #inputArea .btn-file {
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #inputArea .btn-file:active,
        #inputArea .btn-send:active {
            transform: scale(0.94);
        }
        #fileInput {
            display: none;
        }
        #uploadStatus {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            padding: 2px 12px;
            text-align: center;
            min-height: 16px;
        }

        /* ===== Список пользователей ===== */
        #userList {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        #userList .user-item {
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        #userList .user-item:active {
            background: rgba(0, 212, 255, 0.05);
        }
        #userList .user-item .uname {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }
        #userList .user-item .ubadge {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.1);
        }
        #userList .empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.05);
            padding: 30px 0;
            font-size: 13px;
        }

        /* ===== СКРЫТЫЕ БЛОКИ ===== */
        #chatView {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        #usersView {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        #privateChatHeader {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
            color: #00d4ff;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #privateChatHeader button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 4px 14px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            cursor: pointer;
        }
        #privateChatHeader button:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- ===== ЭКРАН ВХОДА ===== -->
        <div id="loginScreen">
            <h1>💬 Братанский</h1>
            <p style="color:rgba(255,255,255,0.2);font-size:13px;" id="loginTitle">Вход в аккаунт</p>
            <input id="loginUsername" type="text" placeholder="Имя пользователя" />
            <input id="loginPassword" type="password" placeholder="Пароль" />
            <div class="error" id="loginError"></div>
            <button id="loginBtn">ВОЙТИ</button>
            <span class="switch" id="switchAuth">Нет аккаунта? Зарегистрироваться</span>
        </div>

        <!-- ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== -->
        <div id="chatUI" style="display:none;flex-direction:column;flex:1;overflow:hidden;">

            <!-- Шапка -->
            <div id="header">
                <div>
                    <span class="user" id="currentUser">—</span>
                    <div class="online" id="onlineStatus">онлайн</div>
                </div>
                <button id="logoutBtn">Выйти</button>
            </div>

            <!-- Вкладки -->
            <div id="tabs">
                <div class="tab active" data-tab="chat">💬 Общий</div>
                <div class="tab" data-tab="users">👥 Пользователи</div>
            </div>

            <!-- Поиск -->
            <div id="searchArea">
                <input id="searchInput" type="text" placeholder="🔍 Найти пользователя по нику..." />
                <div id="searchResult"></div>
            </div>

            <!-- ===== ЧАТ ===== -->
            <div id="chatView">
                <div id="rooms">
                    <div class="room-tab active" data-room="general"># Общий</div>
                    <div class="room-tab" data-room="random"># Рандом</div>
                    <div class="room-tab" data-room="sport"># Спорт</div>
                    <div class="room-tab" data-room="dev"># Dev</div>
                </div>
                <div id="messages"></div>
                <div id="uploadStatus"></div>
                <div id="inputArea">
                    <button class="btn-file" id="fileBtn">📎</button>
                    <input id="fileInput" type="file" multiple />
                    <input id="msgInput" type="text" placeholder="Напиши что-то..." />
                    <button class="btn-send" id="sendBtn">→</button>
                </div>
            </div>

            <!-- ===== ПОЛЬЗОВАТЕЛИ ===== -->
            <div id="usersView">
                <div id="privateChatHeader" style="display:none;">
                    <span id="privateChatTarget">—</span>
                    <button id="closePrivate">✕ Закрыть</button>
                </div>
                <div id="userList">
                    <div class="empty">Загрузка...</div>
                </div>
                <!-- Ввод для лички -->
                <div id="privateInputArea" style="display:none;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.04);flex-shrink:0;gap:8px;align-items:center;">
                    <input id="privateMsgInput" type="text" placeholder="Личное сообщение..." style="flex:1;padding:10px 14px;border-radius:30px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:#fff;font-size:14px;outline:none;" />
                    <button id="privateSendBtn" style="padding:10px 18px;border-radius:30px;border:none;background:linear-gradient(135deg,#00d4ff,#7b2ffc);color:#fff;font-weight:700;font-size:14px;cursor:pointer;">→</button>
                </div>
            </div>

        </div>

    </div>

    <script>
        // ============================================================
        //  ⚡ ТВОИ ДАННЫЕ SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://uxjoowanhrmbrnqtghyc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3Dzhz17WLtHl1jguQlGNTQ_gu2REAg6';
        const BUCKET = 'chat-files';
        // ============================================================

        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------- ЭЛЕМЕНТЫ ----------
        const loginScreen = document.getElementById('loginScreen');
        const chatUI = document.getElementById('chatUI');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const switchAuth = document.getElementById('switchAuth');
        const loginTitle = document.getElementById('loginTitle');
        const logoutBtn = document.getElementById('logoutBtn');
        const currentUser = document.getElementById('currentUser');
        const onlineStatus = document.getElementById('onlineStatus');
        const messagesEl = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const roomTabs = document.querySelectorAll('.room-tab');
        const tabs = document.querySelectorAll('.tab');
        const chatView = document.getElementById('chatView');
        const usersView = document.getElementById('usersView');
        const userList = document.getElementById('userList');
        const searchInput = document.getElementById('searchInput');
        const searchResult = document.getElementById('searchResult');
        const privateChatHeader = document.getElementById('privateChatHeader');
        const privateChatTarget = document.getElementById('privateChatTarget');
        const closePrivate = document.getElementById('closePrivate');
        const privateMsgInput = document.getElementById('privateMsgInput');
        const privateSendBtn = document.getElementById('privateSendBtn');
        const privateInputArea = document.getElementById('privateInputArea');

        // ---------- СОСТОЯНИЕ ----------
        let username = '';
        let userId = null;
        let currentRoom = 'general';
        let channel = null;
        let isSubscribed = false;
        let isLoginMode = true;
        let currentTab = 'chat';
        let privateTarget = null; // ник пользователя для лички
        let allUsers = [];

        // ============================================================
        //  АВТОРИЗАЦИЯ
        // ============================================================

        // Проверка сохранённой сессии
        function checkSession() {
            try {
                const saved = localStorage.getItem('boss_chat_session');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.username && data.userId) {
                        username = data.username;
                        userId = data.userId;
                        loginScreen.style.display = 'none';
                        chatUI.style.display = 'flex';
                        currentUser.textContent = username;
                        loadMessages(currentRoom);
                        subscribeToMessages();
                        loadUsers();
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        // Сохранение сессии
        function saveSession() {
            try {
                localStorage.setItem('boss_chat_session', JSON.stringify({
                    username: username,
                    userId: userId
                }));
            } catch (e) {}
        }

        // Очистка сессии
        function clearSession() {
            localStorage.removeItem('boss_chat_session');
        }

        // Регистрация
        async function register() {
            const name = loginUsername.value.trim();
            const pass = loginPassword.value.trim();

            if (!name || name.length < 2) {
                loginError.textContent = '❌ Имя минимум 2 символа';
                return;
            }
            if (!pass || pass.length < 4) {
                loginError.textContent = '❌ Пароль минимум 4 символа';
                return;
            }

            try {
                // Проверяем, есть ли пользователь
                const { data: existing } = await sbClient
                    .from('users')
                    .select('id')
                    .eq('username', name);

                if (existing && existing.length > 0) {
                    loginError.textContent = '❌ Пользователь уже существует';
                    return;
                }

                // Создаём пользователя
                const { data, error } = await sbClient
                    .from('users')
                    .insert([{
                        username: name,
                        password: pass,
                        last_seen: new Date().toISOString(),
                        ip: await getIP()
                    }])
                    .select();

                if (error) throw error;

                username = name;
                userId = data[0].id;
                saveSession();
                loginScreen.style.display = 'none';
                chatUI.style.display = 'flex';
                currentUser.textContent = username;
                loadMessages(currentRoom);
                subscribeToMessages();
                loadUsers();
                loginError.textContent = '';

            } catch (err) {
                loginError.textContent = '❌ ' + err.message;
            }
        }

        // Вход
        async function login() {
            const name = loginUsername.value.trim();
            const pass = loginPassword.value.trim();

            if (!name || !pass) {
                loginError.textContent = '❌ Заполни все поля';
                return;
            }

            try {
                const { data, error } = await sbClient
                    .from('users')
                    .select('*')
                    .eq('username', name)
                    .eq('password', pass);

                if (error) throw error;

                if (!data || data.length === 0) {
                    loginError.textContent = '❌ Неверный логин или пароль';
                    return;
                }

                username = name;
                userId = data[0].id;

                // Обновляем last_seen и IP
                await sbClient
                    .from('users')
                    .update({
                        last_seen: new Date().toISOString(),
                        ip: await getIP()
                    })
                    .eq('id', userId);

                saveSession();
                loginScreen.style.display = 'none';
                chatUI.style.display = 'flex';
                currentUser.textContent = username;
                loadMessages(currentRoom);
                subscribeToMessages();
                loadUsers();
                loginError.textContent = '';

            } catch (err) {
                loginError.textContent = '❌ ' + err.message;
            }
        }

        // Получение IP (приблизительное)
        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip || 'unknown';
            } catch (e) {
                return 'unknown';
            }
        }

        // Выход
        logoutBtn.addEventListener('click', () => {
            if (channel) {
                channel.unsubscribe();
                channel = null;
                isSubscribed = false;
            }
            clearSession();
            username = '';
            userId = null;
            currentUser.textContent = '';
            chatUI.style.display = 'none';
            loginScreen.style.display = 'flex';
            messagesEl.innerHTML = '';
            loginUsername.value = '';
            loginPassword.value = '';
            loginError.textContent = '';
            privateTarget = null;
            privateChatHeader.style.display = 'none';
            privateInputArea.style.display = 'none';
        });

        // Переключение вход/регистрация
        switchAuth.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            loginTitle.textContent = isLoginMode ? 'Вход в аккаунт' : 'Регистрация нового аккаунта';
            loginBtn.textContent = isLoginMode ? 'ВОЙТИ' : 'ЗАРЕГИСТРИРОВАТЬСЯ';
            switchAuth.textContent = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
            loginError.textContent = '';
        });

        loginBtn.addEventListener('click', () => {
            if (isLoginMode) login();
            else register();
        });

        loginUsername.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginPassword.focus();
        });
        loginPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        // ============================================================
        //  ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ
        // ============================================================

        async function loadUsers() {
            try {
                const { data, error } = await sbClient
                    .from('users')
                    .select('username, last_seen')
                    .neq('username', username)
                    .order('username');

                if (error) throw error;

                allUsers = data || [];
                renderUsers(allUsers);
            } catch (err) {
                console.error('Ошибка загрузки пользователей:', err);
                userList.innerHTML = `<div class="empty">❌ ${err.message}</div>`;
            }
        }

        function renderUsers(users) {
            if (!users || users.length === 0) {
                userList.innerHTML = '<div class="empty">👀 Других пользователей пока нет</div>';
                return;
            }

            userList.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-item';
                const isOnline = Date.now() - new Date(u.last_seen).getTime() < 60000;
                div.innerHTML = `
                    <span class="uname">${escapeHtml(u.username)}</span>
                    <span class="ubadge">${isOnline ? '🟢 онлайн' : '⚫'}</span>
                `;
                div.addEventListener('click', () => {
                    startPrivateChat(u.username);
                });
                userList.appendChild(div);
            });
        }

        // ============================================================
        //  ЛИЧНЫЕ СООБЩЕНИЯ
        // ============================================================

        function startPrivateChat(target) {
            privateTarget = target;
            privateChatTarget.textContent = `💬 Личка с ${target}`;
            privateChatHeader.style.display = 'flex';
            privateInputArea.style.display = 'flex';
            privateMsgInput.focus();

            // Отписываемся от общего чата
            if (channel) {
                channel.unsubscribe();
                channel = null;
                isSubscribed = false;
            }

            // Загружаем личные сообщения
            loadPrivateMessages(target);
            subscribeToPrivateMessages(target);
        }

        async function loadPrivateMessages(target) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('private_messages')
                    .select('*')
                    .or(`and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username})`)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Нет сообщений. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendPrivateMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки личных сообщений:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        function appendPrivateMessage(msg) {
            const div = document.createElement('div');
            div.className = `msg ${msg.sender === username ? 'self' : 'other'}`;

            let content = '';
            if (msg.text) {
                content += escapeHtml(msg.text);
            }
            if (msg.file_url) {
                content += `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 Файл</a>`;
            }

            div.innerHTML = `
                <div class="sender">${msg.sender === username ? 'Вы' : escapeHtml(msg.sender)}</div>
                ${content}
                <div class="time">${formatTime(msg.created_at)}</div>
            `;

            messagesEl.appendChild(div);
        }

        async function sendPrivateMessage(text, fileUrl = null, fileName = null) {
            if (!text && !fileUrl) return;
            if (!privateTarget) return;

            try {
                const { error } = await sbClient
                    .from('private_messages')
                    .insert([{
                        sender: username,
                        receiver: privateTarget,
                        text: text || null,
                        file_url: fileUrl || null,
                        file_name: fileName || null,
                    }]);

                if (error) throw error;

                privateMsgInput.value = '';
                privateMsgInput.focus();

                // Показываем своё сообщение сразу
                const fakeMsg = {
                    sender: username,
                    receiver: privateTarget,
                    text: text,
                    file_url: fileUrl,
                    file_name: fileName,
                    created_at: new Date().toISOString()
                };
                appendPrivateMessage(fakeMsg);
                scrollToBottom();

            } catch (err) {
                console.error('Ошибка отправки личного сообщения:', err);
                uploadStatus.textContent = '❌ ' + err.message;
                uploadStatus.style.color = '#ff4d6d';
                setTimeout(() => {
                    uploadStatus.textContent = '';
                }, 3000);
            }
        }

        function subscribeToPrivateMessages(target) {
            if (channel) {
                channel.unsubscribe();
                channel = null;
                isSubscribed = false;
            }

            channel = sbClient
                .channel(`private-${username}-${target}`)
                .on(
                    'postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'private_messages',
                        filter: `or(and(sender.eq.${username},receiver.eq.${target}),and(sender.eq.${target},receiver.eq.${username}))`,
                    },
                    (payload) => {
                        const msg = payload.new;
                        if (msg.sender === username) return;
                        appendPrivateMessage(msg);
                        scrollToBottom();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        isSubscribed = true;
                        console.log(`✅ Подписка на личку с ${target} активна`);
                    }
                });
        }

        closePrivate.addEventListener('click', () => {
            privateTarget = null;
            privateChatHeader.style.display = 'none';
            privateInputArea.style.display = 'none';
            if (channel) {
                channel.unsubscribe();
                channel = null;
                isSubscribed = false;
            }
            // Возвращаемся в общий чат
            currentRoom = 'general';
            roomTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.room === 'general');
            });
            loadMessages('general');
            subscribeToMessages();
        });

        privateSendBtn.addEventListener('click', () => {
            const text = privateMsgInput.value.trim();
            if (text) {
                sendPrivateMessage(text);
            }
        });

        privateMsgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                privateSendBtn.click();
            }
        });

        // ============================================================
        //  ЗАГРУЗКА ОБЩИХ СООБЩЕНИЙ
        // ============================================================

        async function loadMessages(room) {
            messagesEl.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:20px;font-size:13px;">Загрузка...</div>';

            try {
                const { data, error } = await sbClient
                    .from('messages')
                    .select('*')
                    .eq('room', room)
                    .order('created_at', { ascending: true })
                    .limit(200);

                if (error) throw error;

                messagesEl.innerHTML = '';
                if (!data || data.length === 0) {
                    messagesEl.innerHTML =
                        '<div style="text-align:center;color:rgba(255,255,255,0.05);padding:30px;font-size:13px;">Сообщений пока нет. Напиши первым!</div>';
                    return;
                }

                data.forEach(msg => {
                    appendMessage(msg);
                });

                scrollToBottom();
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                messagesEl.innerHTML = `<div style="text-align:center;color:#ff4d6d;padding:20px;font-size:13px;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.className = `msg ${msg.username === username ? 'self' : 'other'}`;

            let content = '';
            if (msg.text) {
                content += escapeHtml(msg.text);
            }
            if (msg.file_url) {
                const ext = msg.file_url.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
                const isVideo = ['mp4', 'mov', 'avi', 'webm'].includes(ext);

                if (isImage) {
                    content += `<br><img src="${msg.file_url}" style="max-width:100%;border-radius:10px;margin-top:4px;" />`;
                } else if (isVideo) {
                    content +=
                        `<br><video src="${msg.file_url}" controls style="max-width:100%;border-radius:10px;margin-top:4px;"></video>`;
                } else {
                    content += `<br><a href="${msg.file_url}" target="_blank" class="file-link">📄 ${escapeHtml(msg.file_name || 'Файл')}</a>`;
                }
            }

            div.innerHTML = `
                <div class="sender">${escapeHtml(msg.username)}</div>
                ${content}
                <div class="time">${formatTime(msg.created_at)}</div>
            `;

            messagesEl.appendChild(div);
        }

        // ============================================================
        //  ОТПРАВКА ОБЩЕГО СООБЩЕНИЯ
        // ============================================================

        async function sendMessage(text, fileUrl = null, fileName = null) {
            if (!text && !fileUrl) return;
            if (!username) return;

            try {
                const { error } = await sbClient
                    .from('messages')
                    .insert([{
                        username: username,
                        room: currentRoom,
                        text: text || null,
                        file_url: fileUrl || null,
                        file_name: fileName || null,
                    }]);

                if (error) throw error;

                msgInput.value = '';
                msgInput.focus();

                const fakeMsg = {
                    username: username,
                    text: text,
                    file_url: fileUrl,
                    file_name: fileName,
                    created_at: new Date().toISOString()
                };
                appendMessage(fakeMsg);
                scrollToBottom();

            } catch (err) {
                console.error('Ошибка отправки:', err);
                uploadStatus.textContent = '❌ ' + err.message;
                uploadStatus.style.color = '#ff4d6d';
                setTimeout(() => {
                    uploadStatus.textContent = '';
                }, 3000);
            }
        }

        // ============================================================
        //  ЗАГРУЗКА ФАЙЛОВ
        // ============================================================

        async function uploadFiles(files) {
            if (!files || files.length === 0) return;

            for (const file of files) {
                uploadStatus.textContent = `⏫ Загрузка: ${file.name} ...`;
                uploadStatus.style.color = '#ffd93d';

                try {
                    const path = `chats/${Date.now()}_${file.name}`;
                    const { error: uploadError } = await sbClient.storage
                        .from(BUCKET)
                        .upload(path, file, {
                            contentType: file.type,
                            cacheControl: '3600',
                        });

                    if (uploadError) throw uploadError;

                    const { data: urlData } = sbClient.storage
                        .from(BUCKET)
                        .getPublicUrl(path);

                    // Определяем, куда отправлять (личка или общий)
                    if (privateTarget) {
                        await sendPrivateMessage('', urlData.publicUrl, file.name);
                    } else {
                        await sendMessage('', urlData.publicUrl, file.name);
                    }

                    uploadStatus.textContent = `✅ ${file.name} загружен`;
                    uploadStatus.style.color = '#6fcf97';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 2000);

                } catch (err) {
                    console.error('Ошибка загрузки файла:', err);
                    uploadStatus.textContent = `❌ ${file.name}: ${err.message}`;
                    uploadStatus.style.color = '#ff4d6d';
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 3000);
                }
            }
        }

        // ============================================================
        //  REALTIME ПОДПИСКА (ОБЩИЙ ЧАТ)
        // ============================================================

        function subscribeToMessages() {
            if (channel) {
                channel.unsubscribe();
                channel = null;
                isSubscribed = false;
            }

            if (privateTarget) return; // если в личке — не подписываемся на общий

            channel = sbClient
                .channel(`messages-${currentRoom}`)
                .on(
                    'postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                        filter: `room=eq.${currentRoom}`,
                    },
                    (payload) => {
                        const msg = payload.new;
                        if (msg.username === username) return;
                        appendMessage(msg);
                        scrollToBottom();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        isSubscribed = true;
                        console.log(`✅ Подписка на ${currentRoom} активна`);
                    }
                });
        }

        // ============================================================
        //  ПЕРЕКЛЮЧЕНИЕ КОМНАТЫ
        // ============================================================

        function switchRoom(room) {
            if (room === currentRoom && !privateTarget) return;

            // Если были в личке — выходим
            if (privateTarget) {
                privateTarget = null;
                privateChatHeader.style.display = 'none';
                privateInputArea.style.display = 'none';
            }

            currentRoom = room;

            roomTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.room === room);
            });

            loadMessages(room);
            subscribeToMessages();
            msgInput.focus();
        }

        // ============================================================
        //  ВКЛАДКИ
        // ============================================================

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const target = tab.dataset.tab;
                currentTab = target;

                if (target === 'chat') {
                    chatView.style.display = 'flex';
                    usersView.style.display = 'none';
                    searchArea.style.display = 'none';
                    // Если были в личке — остаёмся
                    if (!privateTarget) {
                        loadMessages(currentRoom);
                        subscribeToMessages();
                    }
                } else {
                    chatView.style.display = 'none';
                    usersView.style.display = 'flex';
                    searchArea.style.display = 'block';
                    loadUsers();
                }
            });
        });

        // ============================================================
        //  ПОИСК ПОЛЬЗОВАТЕЛЕЙ
        // ============================================================

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                renderUsers(allUsers);
                searchResult.textContent = '';
                return;
            }

            const filtered = allUsers.filter(u =>
                u.username.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                searchResult.textContent = '❌ Пользователь не найден';
                userList.innerHTML = '<div class="empty">🔍 Никого не найдено</div>';
            } else {
                searchResult.textContent = `✅ Найдено: ${filtered.length}`;
                renderUsers(filtered);
            }
        });

        // ============================================================
        //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================

        function scrollToBottom() {
            setTimeout(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }, 100);
        }

        function formatTime(date) {
            return new Date(date).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  СОБЫТИЯ
        // ============================================================

        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (text) {
                sendMessage(text);
            }
        });

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        fileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFiles(e.target.files);
                fileInput.value = '';
            }
        });

        roomTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                switchRoom(tab.dataset.room);
            });
        });

        // ============================================================
        //  ЗАПУСК
        // ============================================================

        // Проверяем сохранённую сессию
        const hasSession = checkSession();

        if (!hasSession) {
            loginScreen.style.display = 'flex';
            chatUI.style.display = 'none';
        }

        console.log('💬 Братанский мессенджер PRO загружен!');
        console.log('🔐 Есть регистрация и вход');
        console.log('👥 Личные сообщения по клику на пользователя');
        console.log('💾 Сессия сохраняется в localStorage');
    </script>
</body>
</html>
